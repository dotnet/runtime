name: Breaking Change Documentation Dispatcher

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  actions: write

jobs:
  dispatch:
    if: >
      github.repository == 'dotnet/runtime' &&
      github.event.pull_request.merged &&
      (
        (
          github.event.action == 'closed' &&
          contains(github.event.pull_request.labels.*.name, 'needs-breaking-change-doc-created')
        ) ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'needs-breaking-change-doc-created'
        )
      )
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch breaking change documentation workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/breaking-change-doc.lock.yml/dispatches" \
            -f "ref=${DEFAULT_BRANCH}" \
            -f "inputs[pr_number]=${PR_NUMBER}"

parameters:
  alwaysRun: false
  extraBuildArgs: ''
  extraHelixArguments: ''
  isExtraPlatformsBuild: false
  isWasmOnlyBuild: false
  nameSuffix: ''
  platforms: []
  readyToRun: false
  scenarios: ['WasmTestOnWasmtime']
  shouldContinueOnError: false
  shouldRunSmokeOnly: false
  # Default matches the interpreter lane. The R2R lane trims and crossgen2-publishes
  # every test app, which is substantially slower, so its full-run callers raise this.
  timeoutInMinutes: 240
  useHelixMonitor: false

jobs:

#
# Build CoreCLR libraries for WASI and run the library tests on wasmtime via Helix.
# Mirrors wasm-coreclr-library-tests.yml (the browser-CoreCLR LibraryTestsCoreCLR leg),
# with the WasmTestOnWasmtime scenario and the wasi_wasm helix queue.
#
# WasiApp.CoreCLR.targets performs a per-app native link of the wasihost corehost so a
# test's own [UnmanagedCallersOnly] reverse thunks are generated and linked into the host.
#
- template: /eng/pipelines/common/platform-matrix.yml
  parameters:
    jobTemplate: /eng/pipelines/common/global-build-job.yml
    helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
    buildConfig: Release
    runtimeFlavor: coreclr
    platforms: ${{ parameters.platforms }}
    shouldContinueOnError: ${{ parameters.shouldContinueOnError }}
    variables:
      - name: alwaysRunVar
        value: ${{ parameters.alwaysRun }}
      - name: shouldRunOnDefaultPipelines
        value: $[
          or(
            eq(variables['wasmDarcDependenciesChanged'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true))
          ]
      # run smoke tests only if:
      # - explicitly requested
      # - libraries or illink changed and no wasm specific changes
      - name: shouldRunSmokeOnlyVar
        value: $[
          or(
            eq('${{ parameters.shouldRunSmokeOnly }}', 'true'),
            and(
              eq('${{ parameters.shouldRunSmokeOnly }}', 'onLibrariesAndIllinkChanges'),
              ne(variables['wasmDarcDependenciesChanged'], true),
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true)
              )
            )
          )
          ]
      - name: _wasmRunSmokeTestsOnlyArg
        value: /p:RunSmokeTestsOnly=$(shouldRunSmokeOnlyVar)
      - name: wasmReadyToRunArgs
        ${{ if eq(parameters.readyToRun, true) }}:
          value: /p:TestWasmReadyToRun=true /p:EnableAggressiveTrimming=true
        ${{ else }}:
          value: ''

    jobParameters:
      isExtraPlatforms: ${{ parameters.isExtraPlatformsBuild }}
      testGroup: innerloop
      nameSuffix: LibraryTestsCoreCLR_WASI${{ parameters.nameSuffix }}
      buildArgs: -s clr+libs+host+packs+libs.tests -c $(_BuildConfig) /p:ArchiveTests=true $(_wasmRunSmokeTestsOnlyArg) $(wasmReadyToRunArgs) /maxcpucount:1 ${{ parameters.extraBuildArgs }}
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
      condition: >-
        or(
          eq(variables['alwaysRunVar'], true),
          eq(variables['isDefaultPipeline'], variables['shouldRunOnDefaultPipelines']))
      # extra steps, run tests
      postBuildSteps:
        - template: /eng/pipelines/libraries/helix.yml
          parameters:
            creator: dotnet-bot
            testRunNamePrefixSuffix: CoreCLR_WASI${{ parameters.nameSuffix }}_$(_BuildConfig)
            extraHelixArguments: $(_wasmRunSmokeTestsOnlyArg) $(wasmReadyToRunArgs) ${{ parameters.extraHelixArguments }}
            scenarios: ${{ parameters.scenarios }}
            useHelixMonitor: ${{ parameters.useHelixMonitor }}

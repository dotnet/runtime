
parameters:
  - name: templatePath
    type: string
    default: 'templates'
  - name: stages
    type: stageList
  - name: containers
    type: object

resources:
  containers:
    - ${{ each container_pair in parameters.containers }}:
      - ${{ if container_pair.value.image }}:
        - container: ${{ container_pair.key }}
          ${{ each pair in container_pair.value }}:
            ${{ if notIn(pair.key, 'tenantId', 'identityType', 'registry') }}:
              ${{ pair.key }}: ${{ pair.value }}


# Test-only: do not allocate agents for unrelated public pipelines.
stages:
- ${{ if in(variables['Build.DefinitionName'], 'runtime', 'runtime-ioslike') }}:
  - ${{ parameters.stages }}
- ${{ else }}:
  - stage: Skipped
    condition: false
    jobs:
    - job: Skipped
      pool: server
      steps:
      - task: Delay@1
        inputs:
          delayForMinutes: '0'
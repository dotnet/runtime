parameters:
  buildConfig: ''
  osGroup: ''
  osSubgroup: ''
  archType: ''
  container: ''
  testGroup: ''
  testBuildArgs: ''
  crossBuild: false
  readyToRun: false
  compositeBuildMode: false
  helixQueues: ''
  displayNameArgs: RuntimeTests
  runInUnloadableContext: false
  runInterpreter: false
  tieringTest: false
  hotColdSplitting: false
  largeVersionBubble: false
  nativeAotTest: false
  runtimeFlavor: 'mono'
  runtimeVariant: 'monointerpreter'
  useHelixMonitor: false
  llvmAotStepContainer: ''
  scenarios: []
  variables: {}
  pool: ''
  dependsOn: []
  extraHelixArguments: ''
  buildAllTestsAsStandalone: false
  runAfterPreviousFailure: false
  SuperPmiCollect: false
  sendToHelix: true
  #arcade-specific parameters
  condition: true
  continueOnError: false
  displayName: ''
  timeoutInMinutes: ''
  timeoutPerTestInMinutes: '$(timeoutPerTestInMinutes)'
  timeoutPerTestCollectionInMinutes: '$(timeoutPerTestCollectionInMinutes)'
  enableMicrobuild: ''
  shouldContinueOnError: false

steps:
  - ${{ if eq(parameters.osGroup, 'windows') }}:
    - script: |
        echo ##vso[task.setvariable variable=_ProductBuildSucceeded]true
      displayName: Mark product build complete
      condition: succeeded()
  - ${{ if ne(parameters.osGroup, 'windows') }}:
    - script: echo "##vso[task.setvariable variable=_ProductBuildSucceeded]true"
      displayName: Mark product build complete
      condition: succeeded()

  - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests.yml
    parameters:
      osGroup: ${{ parameters.osGroup }}
      osSubgroup: ${{ parameters.osSubgroup }}
      archType: ${{ parameters.archType }}
      buildConfig: ${{ parameters.buildConfig }}
      testBuildArgs: ${{ parameters.testBuildArgs }}
      buildAllTestsAsStandalone: ${{ parameters.buildAllTestsAsStandalone }}
      buildSucceededVariable: _RuntimeTestsBuilt_${{ parameters.displayNameArgs }}
      logRootName: ${{ parameters.displayNameArgs }}
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        continueOnError: true
      ${{ else }}:
        continueOnError: ${{ parameters.continueOnError }}
      ${{ if eq(parameters.runAfterPreviousFailure, true) }}:
        condition: and(succeededOrFailed(), eq(variables['_ProductBuildSucceeded'], 'true'), ${{ parameters.condition }})
      ${{ else }}:
        condition: and(succeeded(), ${{ parameters.condition }})
  # Build a Mono AOT cross-compiler for non-amd64 targets (in this case, just arm64)
  - ${{ if and(eq(parameters.runtimeFlavor, 'mono'), in(parameters.runtimeVariant, 'llvmaot', 'llvmfullaot', 'minifullaot')) }}:
    - ${{ if eq(parameters.archType, 'arm64') }}:
      - ${{ if eq(parameters.runtimeVariant, 'minifullaot') }}:
        - script: ./build.sh
                  -subset mono
                  -c ${{ parameters.buildConfig }}
                  -arch ${{ parameters.archType }}
                  /p:BuildMonoAotCrossCompiler=true
                  /p:BuildMonoAotCrossCompilerOnly=true
                  /p:CrossBuild=true
          displayName: "Build Mono Mini AOT cross compiler"
          condition: and(succeeded(), ${{ parameters.condition }})
      - ${{ else }}:
        - script: ./build.sh
                  -subset mono
                  -c ${{ parameters.buildConfig }}
                  -arch ${{ parameters.archType }}
                  /p:BuildMonoAotCrossCompiler=true
                  /p:BuildMonoAotCrossCompilerOnly=true
                  /p:MonoAOTEnableLLVM=true
                  /p:CrossBuild=true
          displayName: "Build Mono LLVM AOT cross compiler"
          condition: and(succeeded(), ${{ parameters.condition }})

    - ${{ if eq(parameters.archType, 'x64') }}:
      - ${{ if eq(parameters.runtimeVariant, 'llvmaot') }}:
        - script: $(Build.SourcesDirectory)/src/tests/build$(scriptExt) $(logRootNameArg)MonoAot mono_aot ${{ parameters.buildConfig }} -arch ${{ parameters.archType }} /p:RuntimeVariant=${{ parameters.runtimeVariant }}
          displayName: "AOT compile CoreCLR tests"
          condition: and(succeeded(), ${{ parameters.condition }})
          target: ${{ coalesce(parameters.llvmAotStepContainer, parameters.container) }}
      - ${{ if in(parameters.runtimeVariant, 'llvmfullaot', 'minifullaot') }}:
        - script: $(Build.SourcesDirectory)/src/tests/build$(scriptExt) $(logRootNameArg)MonoAot mono_fullaot ${{ parameters.buildConfig }} -arch ${{ parameters.archType }} /p:RuntimeVariant=${{ parameters.runtimeVariant }} -maxcpucount:1
          displayName: "AOT compile CoreCLR tests"
          condition: and(succeeded(), ${{ parameters.condition }})
          target: ${{ coalesce(parameters.llvmAotStepContainer, parameters.container) }}
    - ${{ if eq(parameters.archType, 'arm64') }}:
      - ${{ if eq(parameters.runtimeVariant, 'llvmaot') }}:
        - script: $(Build.SourcesDirectory)/src/tests/build$(scriptExt) $(logRootNameArg)MonoAot mono_aot ${{ parameters.buildConfig }} -arch ${{ parameters.archType }} cross /p:RuntimeVariant=${{ parameters.runtimeVariant }} -maxcpucount:2
          displayName: "AOT cross-compile CoreCLR tests"
          condition: and(succeeded(), ${{ parameters.condition }})
          env:
            __MonoToolPrefix: aarch64-linux-gnu-
      - ${{ if in(parameters.runtimeVariant, 'llvmfullaot', 'minifullaot') }}:
        - script: $(Build.SourcesDirectory)/src/tests/build$(scriptExt) $(logRootNameArg)MonoAot mono_fullaot ${{ parameters.buildConfig }} -arch ${{ parameters.archType }} cross /p:RuntimeVariant=${{ parameters.runtimeVariant }} -maxcpucount:2
          displayName: "AOT cross-compile CoreCLR tests"
          condition: and(succeeded(), ${{ parameters.condition }})
          env:
            __MonoToolPrefix: aarch64-linux-gnu-

  # Build the runtime tests above, but only include the Helix submission when sendToHelix is true.
  # Engines that cannot run the tests yet (e.g. browser/V8 without exnref support) still retain
  # build coverage without instantiating a send step.
  - ${{ if eq(parameters.sendToHelix, true) }}:
    - template: /eng/pipelines/common/templates/runtimes/send-to-helix-step.yml
      parameters:
        displayName: Send tests to Helix ${{ parameters.displayNameArgs }}
        buildConfig: $(buildConfigUpper)
        archType: ${{ parameters.archType }}
        osGroup: ${{ parameters.osGroup }}
        osSubgroup: ${{ parameters.osSubgroup}}
        ${{ if eq(variables['System.TeamProject'], 'internal') }}:
          shouldContinueOnError: true
        ${{ else }}:
          shouldContinueOnError: ${{ parameters.shouldContinueOnError }}
        runtimeFlavor: ${{ parameters.runtimeFlavor }}
        runtimeVariant: ${{ parameters.runtimeVariant }}

        ${{ if eq(variables['System.TeamProject'], 'internal') }}:
          # Access token variable for internal project from the
          # DotNet-HelixApi-Access variable group
          helixAccessToken: $(HelixApiAccessToken)
        ${{ else }}:
          creator: $(Build.DefinitionName)

        helixBuild: $(Build.BuildNumber)
        helixSource: $(_HelixSource)
        ${{ if eq(parameters.readyToRun, true) }}:
          helixType: 'test/functional/r2r/cli/'
        ${{ if ne(parameters.readyToRun, true) }}:
          helixType: 'test/functional/cli/'

        helixQueues: ${{ parameters.helixQueues }}
        useHelixMonitor: ${{ parameters.useHelixMonitor }}
        logRootName: SendToHelix_${{ parameters.displayNameArgs }}
        # This tests whether an array is empty.
        ${{ if eq(join('', parameters.helixQueues), '') }}:
          condition: false
        ${{ elseif eq(parameters.runAfterPreviousFailure, true) }}:
          condition: and(succeededOrFailed(), eq(variables['_ProductBuildSucceeded'], 'true'), eq(variables['_RuntimeTestsBuilt_${{ parameters.displayNameArgs }}'], 'true'), ${{ parameters.condition }})
        ${{ else }}:
          condition: and(succeeded(), eq(variables['_RuntimeTestsBuilt_${{ parameters.displayNameArgs }}'], 'true'), ${{ parameters.condition }})
        publishTestResults: true
        timeoutPerTestInMinutes: ${{ parameters.timeoutPerTestInMinutes }}
        timeoutPerTestCollectionInMinutes: ${{ parameters.timeoutPerTestCollectionInMinutes }}
        runCrossGen2: ${{ eq(parameters.readyToRun, true) }}
        compositeBuildMode: ${{ parameters.compositeBuildMode }}
        runInUnloadableContext: ${{ parameters.runInUnloadableContext }}
        runInterpreter: ${{ parameters.runInterpreter }}
        tieringTest: ${{ parameters.tieringTest }}
        hotColdSplitting: ${{ parameters.hotColdSplitting }}
        largeVersionBubble: ${{ parameters.largeVersionBubble }}
        nativeAotTest: ${{ parameters.nativeAotTest }}
        longRunningGcTests: ${{ eq(parameters.testGroup, 'gc-longrunning') }}
        gcSimulatorTests: ${{ eq(parameters.testGroup, 'gc-simulator') }}
        SuperPmiCollect: ${{ parameters.SuperPmiCollect }}
        helixProjectArguments: '$(Build.SourcesDirectory)/src/tests/Common/helixpublishwitharcade.proj'
        extraHelixArguments: ${{ parameters.extraHelixArguments }}
        ${{ if ne(join('', parameters.scenarios), '') }}:
          scenarios: ${{ parameters.scenarios }}
        ${{ else }}:
          ${{ if in(parameters.testGroup, 'innerloop', 'outerloop') }}:
            ${{ if and(eq(parameters.runInterpreter, true), eq(variables['Build.Reason'], 'PullRequest')) }}:
              scenarios:
              - interpmode3_no_tiered_compilation
              - interpmode2_no_tiered_compilation
              - interpmode1_no_tiered_compilation
              - no_tiered_compilation
            ${{ elseif eq(parameters.runInterpreter, true) }}:
              scenarios:
              - interpmode3_no_tiered_compilation
              - interpmode3
              - interpmode2_no_tiered_compilation
              - interpmode2
              - normal
              - no_tiered_compilation
              - interpmode1_no_tiered_compilation
              - interpmode1
            ${{ elseif eq(parameters.runtimeFlavor, 'mono') }}:
              scenarios:
              - normal
            ${{ elseif eq(variables['Build.Reason'], 'PullRequest') }}:
              scenarios:
              - no_tiered_compilation
            ${{ else }}:
              scenarios:
              - normal
              - no_tiered_compilation
          ${{ if eq(parameters.testGroup, 'jitstress') }}:
            scenarios:
            - jitminopts
            - jitstress1
            - jitstress1_tiered
            - jitstress2
            - jitstress2_tiered
            - disabler2r
            - tailcallstress
          ${{ if eq(parameters.testGroup, 'jitstress-random') }}:
            scenarios:
            - jitstress_random_1
            - jitstress_random_2
          ${{ if eq(parameters.testGroup, 'jitstress-isas-arm') }}:
            scenarios:
            - jitstress_isas_nohwintrinsic
          ${{ if eq(parameters.testGroup, 'jitstress-isas-x86') }}:
            scenarios:
            - jitstress_isas_nohwintrinsic
            - jitstress_isas_x86_evex
            - jitstress_isas_x86_noavx
            - jitstress_isas_x86_noavx2
            - jitstress_isas_x86_noavx512
            - jitstress_isas_x86_vectort128
            - jitstress_isas_x86_vectort512
            - jitstress_isas_x86_noavx512_vectort128
            - jitstress_isas_1_x86_evex
            - jitstress_isas_1_x86_noavx
            - jitstress_isas_1_x86_noavx2
            - jitstress_isas_1_x86_noavx512
            - jitstress_isas_1_x86_vectort128
            - jitstress_isas_1_x86_vectort512
            - jitstress_isas_1_x86_noavx512_vectort128
            - jitstress_isas_2_x86_evex
            - jitstress_isas_2_x86_noavx
            - jitstress_isas_2_x86_noavx2
            - jitstress_isas_2_x86_noavx512
            - jitstress_isas_2_x86_vectort128
            - jitstress_isas_2_x86_vectort512
            - jitstress_isas_2_x86_noavx512_vectort128
          ${{ if eq(parameters.testGroup, 'jitstress-isas-avx512') }}:
            scenarios:
            - jitstress_isas_x86_evex
            - jitstress_isas_x86_noavx512
            - jitstressregs0x2000
          ${{ if eq(parameters.testGroup, 'jitstressregs-x86') }}:
            scenarios:
            - jitstressregs1_x86_noavx
            - jitstressregs2_x86_noavx
            - jitstressregs3_x86_noavx
            - jitstressregs4_x86_noavx
            - jitstressregs8_x86_noavx
            - jitstressregs0x10_x86_noavx
            - jitstressregs0x80_x86_noavx
            - jitstressregs0x1000_x86_noavx
            - jitstressregs0x2000_x86_noavx
          ${{ if eq(parameters.testGroup, 'jitstressregs') }}:
            scenarios:
            - jitstressregs1
            - jitstressregs2
            - jitstressregs3
            - jitstressregs4
            - jitstressregs8
            - jitstressregs0x10
            - jitstressregs0x80
            - jitstressregs0x1000
            - jitstressregs0x2000
          ${{ if eq(parameters.testGroup, 'jitstress2-jitstressregs') }}:
            scenarios:
            - jitstress2_jitstressregs1
            - jitstress2_jitstressregs2
            - jitstress2_jitstressregs3
            - jitstress2_jitstressregs4
            - jitstress2_jitstressregs8
            - jitstress2_jitstressregs0x10
            - jitstress2_jitstressregs0x80
            - jitstress2_jitstressregs0x1000
            - jitstress2_jitstressregs0x2000
          ${{ if eq(parameters.testGroup, 'gcstress0x3-gcstress0xc') }}:
            scenarios:
            - gcstress0x3
            - gcstress0xc
          ${{ if eq(parameters.testGroup, 'gcstress-extra') }}:
            scenarios:
            - heapverify1
            - gcstress0xc_disabler2r
            - gcstress0xc_disabler2r_jitstress2
            - gcstress0xc_disabler2r_heapverify1
            - gcstress0xc_jitstress1
            - gcstress0xc_jitstress2
            - gcstress0xc_tailcallstress
            - gcstress0xc_jitminopts_heapverify1
          ${{ if eq(parameters.testGroup, 'r2r-extra') }}:
            scenarios:
            - jitstress1
            - jitstress2
            - jitstress1_tiered
            - jitstress2_tiered
            - jitstressregs1
            - jitstressregs2
            - jitstressregs3
            - jitstressregs4
            - jitstressregs8
            - jitstressregs0x10
            - jitstressregs0x80
            - jitstressregs0x1000
            - jitstressregs0x2000
            - jitminopts
            - forcerelocs
            - gcstress0xc
          ${{ if eq(parameters.testGroup, 'pgo') }}:
            scenarios:
            - defaultpgo
          ${{ if eq(parameters.testGroup, 'pgostress') }}:
            ${{ if and(eq(parameters.osGroup, 'windows'), eq(parameters.archType, 'arm64')) }}:
              scenarios:
              - fullpgo
              - fullpgo_random_gdv_edge
            ${{ else }}:
              scenarios:
              - fullpgo
              - fullpgo_methodprofiling
              - fullpgo_random_gdv
              - fullpgo_random_gdv_methodprofiling_only
              - fullpgo_random_gdv_edge
              - fullpgo_methodprofiling_always_optimized
              - syntheticpgo
              - syntheticpgo_blend
              - instrument_if_optimizing
          ${{ if eq(parameters.testGroup, 'gc-longrunning') }}:
            scenarios:
            - normal
          ${{ if eq(parameters.testGroup, 'gc-simulator') }}:
            scenarios:
            - normal
          ${{ if eq(parameters.testGroup, 'gc-standalone') }}:
            scenarios:
            - gcstandalone
          ${{ if eq(parameters.testGroup, 'gc-standalone-server') }}:
            scenarios:
            - gcstandaloneserver
          ${{ if eq(parameters.testGroup, 'jitelthookenabled') }}:
            scenarios:
            - jitelthookenabled
            - jitelthookenabled_tiered
          ${{ if eq(parameters.testGroup, 'jit-experimental') }}:
            ${{ if and(eq(parameters.osGroup, 'windows'), eq(parameters.archType, 'arm64')) }}:
              scenarios:
              - jitosr_stress
              - jitpartialcompilation_pgo
              - jitpartialcompilation_pgo_stress_random
              - jitoptrepeat
            ${{ else }}:
              scenarios:
              - jitosr_stress
              - jitosr_stress_random
              - jit_stress_splitting
              - jitpartialcompilation
              - jitpartialcompilation_pgo
              - jitpartialcompilation_pgo_stress_random
              - jitobjectstackallocation
              - jitphysicalpromotion_only
              - jitphysicalpromotion_full
              - jitrlcse
              - jitoptrepeat
          ${{ if eq(parameters.testGroup, 'jit-cfg') }}:
            scenarios:
            - jitcfg
            - jitcfg_dispatcher_always
            - jitcfg_dispatcher_never
            - jitcfg_gcstress0xc
          ${{ if eq(parameters.testGroup, 'ilasm') }}:
            scenarios:
            - ilasmroundtrip
          ${{ if eq(parameters.testGroup, '') }}:
            scenarios:
            - normal

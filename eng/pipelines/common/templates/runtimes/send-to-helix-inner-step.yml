parameters:
  osGroup: ''
  sendParams: ''
  condition: ''
  displayName: ''
  environment: {}
  shouldContinueOnError: false
  useEntraAuthentication: false
  azureSubscription: ''
  helixBaseUri: 'https://helix.dot.net/'

steps:
- ${{ if and(eq(parameters.useEntraAuthentication, true), eq(parameters.azureSubscription, '')) }}:
  - pwsh: throw "azureSubscription must be set when useEntraAuthentication is true."
    displayName: Validate Helix Entra authentication
    condition: and(succeeded(), ${{ and(ne(parameters.condition, false), ne(parameters.sendParams, '')) }})

- ${{ if eq(parameters.osGroup, 'windows') }}:
  - ${{ if eq(parameters.useEntraAuthentication, true) }}:
    - task: AzureCLI@2
      displayName: ${{ parameters.displayName }} (Windows)
      inputs:
        azureSubscription: ${{ parameters.azureSubscription }}
        keepAzSessionActive: true
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: >
          $(Build.SourcesDirectory)\eng\common\msbuild.ps1
          --restore
          -ci
          -warnaserror 0
          /p:HelixUseEntraAuthentication=true
          ${{ parameters.sendParams }}
      condition: and(succeeded(), ${{ and(ne(parameters.condition, false), ne(parameters.sendParams, '')) }})
      env:
        ${{ insert }}: ${{ parameters.environment }}
        HelixBaseUri: ${{ parameters.helixBaseUri }}
      continueOnError: ${{ eq(parameters.shouldContinueOnError, true) }}
  - ${{ else }}:
    - powershell: $(Build.SourcesDirectory)\eng\common\msbuild.ps1 --restore -ci -warnaserror 0 /p:HelixUseEntraAuthentication=false ${{ parameters.sendParams }}
      displayName: ${{ parameters.displayName }} (Windows)
      condition: and(succeeded(), ${{ and(ne(parameters.condition, false), ne(parameters.sendParams, '')) }})
      env:
        ${{ insert }}: ${{ parameters.environment }}
        HelixBaseUri: ${{ parameters.helixBaseUri }}
      continueOnError: ${{ eq(parameters.shouldContinueOnError, true) }}

- ${{ if ne(parameters.osGroup, 'windows') }}:
  - ${{ if eq(parameters.useEntraAuthentication, true) }}:
    - task: AzureCLI@2
      displayName: ${{ parameters.displayName }} (Unix)
      inputs:
        azureSubscription: ${{ parameters.azureSubscription }}
        keepAzSessionActive: true
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: >
          $(Build.SourcesDirectory)/eng/common/msbuild.sh
          --restore
          --ci
          --warnaserror false
          /p:HelixUseEntraAuthentication=true
          ${{ parameters.sendParams }}
      condition: and(succeeded(), ${{ and(ne(parameters.condition, false), ne(parameters.sendParams, '')) }})
      env:
        ${{ insert }}: ${{ parameters.environment }}
        HelixBaseUri: ${{ parameters.helixBaseUri }}
      continueOnError: ${{ eq(parameters.shouldContinueOnError, true) }}
  - ${{ else }}:
    - script: $(Build.SourcesDirectory)/eng/common/msbuild.sh --restore --ci --warnaserror false /p:HelixUseEntraAuthentication=false ${{ parameters.sendParams }}
      displayName: ${{ parameters.displayName }} (Unix)
      condition: and(succeeded(), ${{ and(ne(parameters.condition, false), ne(parameters.sendParams, '')) }})
      env:
        ${{ insert }}: ${{ parameters.environment }}
        HelixBaseUri: ${{ parameters.helixBaseUri }}
      continueOnError: ${{ eq(parameters.shouldContinueOnError, true) }}

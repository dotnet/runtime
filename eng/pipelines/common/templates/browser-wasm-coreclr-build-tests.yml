# Depends on other builds to get runtime packs, and nugets
# And then runs Wasm.Build.Tests
parameters:
  alwaysRun: false
  isExtraPlatformsBuild: false
  isWasmOnlyBuild: false
  platforms: []
  shouldContinueOnError: false
  extraBuildArgs: ''
  useHelixMonitor: false

jobs:

- ${{ each platform in parameters.platforms }}:
  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
      buildConfig: Release
      runtimeFlavor: CoreCLR
      platforms:
        - ${{ platform }}
      shouldContinueOnError: ${{ parameters.shouldContinueOnError }}
      variables:
        # map dependencies variables to local variables
        - name: alwaysRunVar
          value: ${{ parameters.alwaysRun }}
        - name: workloadsTestPreviousVersionsVar
          value: false
#         value: $[
#           or(
#             eq(variables['Build.SourceBranchName'], 'main'),
#             eq(variables['System.PullRequest.TargetBranch'], 'main'))
#           ]
        - name: wbtProjectArg
          ${{ if eq(platform, 'browser_wasm_win') }}:
            value: '-projects'
          ${{ else }}:
            value: '--projects'
        - name: shouldRunOnDefaultPipelines
          value: $(shouldRunWasmBuildTestsOnDefaultPipeline)

      jobParameters:
        dependsOn:
          - ${{ if eq(platform, 'browser_wasm') }}:
            - build_browser_wasm_linux_Release_CoreCLR
          - ${{ if eq(platform, 'browser_wasm_win') }}:
            - build_browser_wasm_windows_Release_CoreCLR
        isExtraPlatforms: ${{ parameters.isExtraPlatformsBuild }}
        testGroup: innerloop
        nameSuffix: CoreCLR_WasmBuildTests

        preBuildSteps:
          - task: DownloadPipelineArtifact@2
            displayName: Download CoreCLR runtime and workload packages
            inputs:
              buildType: current
              artifactName: 'BuildArtifacts_browser_wasm_$(_hostedOs)_Release_CoreCLR'
              targetPath: '$(Build.SourcesDirectory)/artifacts/BuildArtifacts_browser_wasm_$(_hostedOs)_Release_CoreCLR'

          - task: CopyFiles@2
            displayName: Copy CoreCLR build artifacts
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/artifacts/BuildArtifacts_browser_wasm_$(_hostedOs)_Release_CoreCLR'
              TargetFolder: '$(Build.SourcesDirectory)/artifacts'
              CleanTargetFolder: false

          - task: DownloadPipelineArtifact@2
            displayName: Download Wasm.Build.Tests
            inputs:
              buildType: current
              artifactName: WasmBuildTests_$(_hostedOs)_CoreCLR
              targetPath: '$(Build.SourcesDirectory)/artifacts/WasmBuildTests_$(_hostedOs)_CoreCLR'

          - task: CopyFiles@2
            displayName: Copy Wasm.Build.Tests archive
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/artifacts/WasmBuildTests_$(_hostedOs)_CoreCLR'
              Contents: helix/**
              TargetFolder: '$(Build.SourcesDirectory)/artifacts'
              CleanTargetFolder: false

        # build WBT
        buildArgs: >-
          $(wbtProjectArg) $(Build.SourcesDirectory)/src/mono/wasm/Wasm.Build.Tests/Wasm.Build.Tests.csproj
          /bl:$(Build.SourcesDirectory)/artifacts/log/$(_BuildConfig)/Build.binlog
          /p:Configuration=$(_BuildConfig)
          /p:TestUsingWorkloads=true
          /p:InstallWorkloadForTesting=true
          /p:WasmSkipMissingRuntimePackBuild=true
          /p:PreparePackagesForWorkloadInstall=false
          /p:WorkloadsTestPreviousVersions=$(workloadsTestPreviousVersionsVar)
          /p:RuntimeFlavor=CoreCLR
        timeoutInMinutes: 180
        condition: >-
          or(
            eq(variables['alwaysRunVar'], true),
            eq(variables['isDefaultPipeline'], variables['shouldRunWasmBuildTestsOnDefaultPipeline']))

        # extra steps, run tests
        postBuildSteps:
          - template: /eng/pipelines/libraries/helix.yml
            parameters:
              creator: dotnet-bot
              testRunNamePrefixSuffix: CoreCLR_$(_BuildConfig)_$(_hostedOs)
              # WBT (buildwasmapps) fans out into several sendtohelixhelp.proj invocations
              # (Workloads/Webcil/Fingerprinting/Bundler combos). sendtohelix.proj already builds
              # them with BuildInParallel=true, but that only parallelizes when the msbuild running
              # it has multiple nodes. /maxcpucount lets the Helix jobs be sent (and waited on)
              # concurrently instead of one-send-then-wait-for-completion serially (see issue #118938).
              extraHelixArguments: /p:BrowserHost=$(_hostedOs) /maxcpucount:8
              scenarios:
              - buildwasmapps
              useHelixMonitor: ${{ parameters.useHelixMonitor }}

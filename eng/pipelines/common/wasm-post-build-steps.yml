parameters:
  nameSuffix: ''
  buildConfig: ''
  hostedOs: ''
  osGroup: ''
  publishArtifactsForWorkload: always()
  publishWBT: always()

steps:

  # The wasm CoreCLR build runs crossgen2 to generate the P/Invoke call helpers while building test
  # apps, so the Wasm.Build.Tests leg ships it to Helix as a correlation payload. That leg builds only
  # the test project and takes everything else from here, so crossgen2 has to travel in these
  # artifacts. The glob matches nothing for Mono, which has no crossgen2 to send.
  - task: CopyFiles@2
    displayName: Copy artifacts needed for running WBT
    condition: and(succeeded(), ${{ parameters.publishArtifactsForWorkload }})
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/artifacts'
      Contents: |
        packages/$(_BuildConfig)/Shipping/**
        packages/$(_BuildConfig)/NonShipping/**
        bin/WasmAppBuilder/**/*
        bin/WasmBuildTasks/**
        bin/WorkloadBuildTasks/**
        bin/installer.tasks/**
        bin/Crossgen2Tasks/**
        bin/coreclr/${{ parameters.osGroup }}.wasm.*/*/crossgen2/**
      TargetFolder: '$(Build.StagingDirectory)/IntermediateArtifacts'
      CleanTargetFolder: true

  - task: PublishPipelineArtifact@1
    displayName: Publish intermediate artifacts
    condition: and(succeeded(), ${{ parameters.publishArtifactsForWorkload }})
    inputs:
      targetPath: '$(Build.StagingDirectory)/IntermediateArtifacts'
      artifactName: BuildArtifacts_${{ parameters.osGroup }}_wasm_$(_hostedOs)_${{ parameters.buildConfig }}_${{ parameters.nameSuffix }}

  - task: CopyFiles@2
    displayName: Copy WBT
    condition: and(succeeded(), ${{ parameters.publishWBT }})
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/artifacts'
      Contents: helix/buildwasmapps/**
      TargetFolder: '$(Build.StagingDirectory)/IntermediateArtifacts'
      CleanTargetFolder: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Wasm.Build.Tests archive
    condition: and(succeeded(), ${{ parameters.publishWBT }})
    inputs:
      targetPath: '$(Build.StagingDirectory)/IntermediateArtifacts'
      artifactName: WasmBuildTests_$(_hostedOs)_${{ parameters.nameSuffix }}

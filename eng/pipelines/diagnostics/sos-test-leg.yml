# sos-test-leg.yml -- downloads the per-platform cDAC build artifacts,
# builds dotnet/diagnostics, then submits SOS.Tests to Helix.

parameters:
  buildConfig: ''
  nameSuffix: ''
  archType: ''
  hostedOs: ''
  osGroup: ''
  osSubgroup: ''
  container: ''
  crossBuild: false
  variables: []
  targetRid: ''
  timeoutInMinutes: ''
  dependsOn: []
  dependsOnGlobalBuilds: []
  pool: ''
  platform: ''
  condition: true
  shouldContinueOnError: false
  isOfficialBuild: false
  runtimeFlavor: 'coreclr'
  helixQueueGroup: ''
  templatePath: 'templates'
  templateContext: ''
  disableComponentGovernance: ''

jobs:
- template: /eng/common/${{ parameters.templatePath }}/job/job.yml
  parameters:
    name: ${{ format('build_{0}{1}_{2}_{3}_{4}', parameters.osGroup, parameters.osSubgroup, parameters.archType, parameters.buildConfig, parameters.nameSuffix) }}
    displayName: ${{ format('{0}{1}-{2} {3} {4}', parameters.osGroup, parameters.osSubgroup, parameters.archType, parameters.buildConfig, parameters.nameSuffix) }}
    pool: ${{ parameters.pool }}
    container: ${{ parameters.container }}
    condition: and(succeeded(), ${{ parameters.condition }})
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}

    ${{ if ne(parameters.templateContext, '') }}:
      templateContext: ${{ parameters.templateContext }}

    artifacts:
      publish:
        logs:
          name: Logs_Build_Attempt$(System.JobAttempt)_${{ parameters.osGroup }}_${{ parameters.osSubgroup }}_${{ parameters.archType }}_${{ parameters.buildConfig }}_${{ parameters.nameSuffix }}

    # Component governance does not work on musl machines
    ${{ if eq(parameters.osSubgroup, '_musl') }}:
      disableComponentGovernance: true
    ${{ else }}:
      disableComponentGovernance: ${{ parameters.disableComponentGovernance }}

    workspace:
      clean: all

    ${{ if or(ne(parameters.dependsOn, ''), ne(parameters.dependsOnGlobalBuilds, '')) }}:
      dependsOn:
      - ${{ each build in parameters.dependsOn }}:
        - ${{ build }}
      - ${{ each globalBuild in parameters.dependsOnGlobalBuilds }}:
        - ${{ format('build_{0}{1}_{2}_{3}_{4}', parameters.osGroup, parameters.osSubgroup, parameters.archType, coalesce(globalBuild.buildConfig, parameters.buildConfig), globalBuild.nameSuffix) }}

    variables:
    - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
      - group: DotNet-HelixApi-Access
      - group: AzureDevOps-Artifact-Feeds-Pats
    - _PhaseName: ${{ parameters.nameSuffix }}_${{ parameters.archType }}_${{ parameters.buildConfig }}
    - _Pipeline_StreamDumpDir: $(Build.SourcesDirectory)/artifacts/tmp/${{ parameters.buildConfig }}/streams
    - _DiagnosticsConfiguration: ${{ replace(parameters.buildConfig, 'release', 'Release') }}
    - _DiagnosticsCrossBuildArg: ''
    - ${{ if or(eq(parameters.osGroup, 'linux'), and(eq(parameters.osGroup, 'osx'), eq(parameters.archType, 'arm64'))) }}:
      - _DiagnosticsCrossBuildArg: '-cross'
    - ${{ each variable in parameters.variables }}:
      - ${{ variable }}

    steps:
    - ${{ if eq(parameters.osGroup, 'windows') }}:
      - template: /eng/pipelines/common/templates/disable-vsupdate-or-failfast.yml

    - checkout: diagnostics
      clean: true
      fetchDepth: $(checkoutFetchDepth)
      fetchTags: false

    - ${{ if and(eq(parameters.isOfficialBuild, true), eq(parameters.osGroup, 'windows')) }}:
      - template: /eng/pipelines/common/restore-internal-tools.yml

    - template: /eng/common/${{ parameters.templatePath }}/steps/enable-internal-sources.yml

    - ${{ if or(in(parameters.osGroup, 'osx', 'maccatalyst', 'ios', 'iossimulator', 'tvos', 'tvossimulator'), eq(parameters.hostedOs, 'osx')) }}:
      - template: /eng/pipelines/common/select-xcode.yml
      - script: $(Build.SourcesDirectory)/eng/common/native/install-dependencies.sh osx
        displayName: Install Build Dependencies

    - template: /eng/pipelines/common/download-artifact-step.yml
      parameters:
        artifactName: SosRuntimeArtifacts_$(osGroup)$(osSubgroup)_$(archType)
        artifactFileName: SosRuntimeArtifacts_$(osGroup)$(osSubgroup)_$(archType)$(archiveExtension)
        unpackFolder: $(Build.SourcesDirectory)/artifacts/runtime
        displayName: 'SOS Runtime Artifacts'

    - template: /eng/pipelines/common/download-artifact-step.yml
      parameters:
        artifactName: SosCdacArtifacts_$(osGroup)$(osSubgroup)_$(archType)
        artifactFileName: SosCdacArtifacts_$(osGroup)$(osSubgroup)_$(archType)$(archiveExtension)
        unpackFolder: $(Build.SourcesDirectory)/artifacts/private-cdac
        displayName: 'SOS cDAC Artifacts'

    - pwsh: |
        $runtimeDir = "$(Build.SourcesDirectory)/artifacts/runtime"
        if (-not (Test-Path -PathType Leaf "$runtimeDir/System.Private.CoreLib.dll")) {
          throw "The SOS private runtime was not found at '$runtimeDir'."
        }

        Write-Host "##vso[task.setvariable variable=sosRuntimeDir]$runtimeDir"
      displayName: 'Find SOS Private Runtime'

    - pwsh: |
        $queue = switch ("${{ parameters.osGroup }}_${{ parameters.archType }}") {
          "windows_x64"   { "$(helix_windows_x64)" }
          "windows_x86"   { "$(helix_windows_x64)" }
          "windows_arm64" { "$(helix_windows_arm64)" }
          "linux_x64"     { "$(helix_linux_x64_oldest)" }
          "linux_arm64"   { "$(helix_linux_arm64_oldest)" }
          "linux_arm"     { "$(helix_linux_arm32_oldest)" }
          "osx_x64"       { "$(helix_macos_x64)" }
          "osx_arm64"     { "$(helix_macos_arm64)" }
          default         { throw "Unsupported SOS platform: ${{ parameters.osGroup }}_${{ parameters.archType }}" }
        }

        Write-Host "##vso[task.setvariable variable=SOSHelixQueue]$queue"
      displayName: 'Configure SOS Helix Queue'

    - ${{ if eq(parameters.osGroup, 'windows') }}:
      - powershell: |
          & "$(Build.SourcesDirectory)\Build.cmd" `
            -ci `
            -configuration $(_DiagnosticsConfiguration) `
            -architecture ${{ parameters.archType }} `
            -privatebuild `
            $(_DiagnosticsCrossBuildArg) `
            /p:PackageWithCDac=false `
            /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
          exit $LASTEXITCODE
        displayName: Build

    - ${{ if ne(parameters.osGroup, 'windows') }}:
      - script: >
          $(Build.SourcesDirectory)/build.sh
          -ci
          -configuration $(_DiagnosticsConfiguration)
          -architecture ${{ parameters.archType }}
          -privatebuild
          $(_DiagnosticsCrossBuildArg)
          /p:PackageWithCDac=false
          /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
        displayName: Build

    - pwsh: |
        $sourceDir = "$(Build.SourcesDirectory)/artifacts/private-cdac"
        $overrideDir = "$(Build.SourcesDirectory)/artifacts/cdac-override/$(_DiagnosticsConfiguration)"
        New-Item -ItemType Directory -Force -Path $overrideDir | Out-Null

        $fileNames = switch ("${{ parameters.osGroup }}") {
          "windows" { "mscordaccore_universal.dll", "mscordbi_universal.dll" }
          "linux"   { "libmscordaccore_universal.so", "libmscordbi_universal.so" }
          "osx"     { "libmscordaccore_universal.dylib", "libmscordbi_universal.dylib" }
          default   { throw "Unsupported SOS platform: ${{ parameters.osGroup }}" }
        }

        foreach ($fileName in $fileNames) {
          $source = Join-Path $sourceDir $fileName
          if (-not (Test-Path -PathType Leaf $source)) {
            throw "Private cDAC input '$source' was not found."
          }

          Copy-Item -Path $source -Destination $overrideDir
        }
      displayName: 'Stage Private cDAC'

    - template: /eng/pipelines/send-to-helix-step.yml@diagnostics
      parameters:
        displayName: Run SOS.Tests on Helix
        osGroup: ${{ parameters.osGroup }}
        sendParams: >
          $(Build.SourcesDirectory)/eng/helix/SendToHelix.proj
          /restore
          /p:TreatWarningsAsErrors=false
          /t:Test
          /p:Configuration=$(_DiagnosticsConfiguration)
          /p:TargetArch=${{ parameters.archType }}
          /p:TargetOS=${{ replace(parameters.osGroup, 'windows', 'Windows_NT') }}
          /p:TargetRid=${{ parameters.targetRid }}
          /p:PackageWithCDac=false
          /p:PrivateBuildTesting=true
          /p:LiveRuntimeDir=$(sosRuntimeDir)
          /p:HelixTestProject=$(Build.SourcesDirectory)/src/tests/SOS.Tests/SOS.Tests.csproj
          /p:OfficialBuildId=$(BUILD.BUILDNUMBER)
          /bl:$(Build.SourcesDirectory)/artifacts/log/$(_DiagnosticsConfiguration)/SendTestsToHelix.binlog
        env:
          HelixSource: pr/dotnet/runtime/diagnostics
          HelixType: tests/sos/
          HelixConfiguration: ${{ parameters.targetRid }}_${{ parameters.buildConfig }}
          HelixTargetQueues: $(SOSHelixQueue)
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          ${{ if eq(variables['System.TeamProject'], 'public') }}:
            Creator: dotnet-bot
          ${{ else }}:
            HelixAccessToken: $(HelixApiAccessToken)

    - task: CopyFiles@2
      displayName: Gather Helix logs
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)/artifacts'
        contents: '?(log|TestResults)/**'
        targetFolder: '$(Build.StagingDirectory)/HelixLogs'
      continueOnError: true
      condition: always()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.StagingDirectory)/HelixLogs'
        artifactName: 'Logs_${{ parameters.nameSuffix }}_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_Attempt$(System.JobAttempt)'
      displayName: 'Publish Helix Logs'
      continueOnError: true
      condition: always()

    - ${{ if eq(parameters.osGroup, 'osx') }}:
      - script: |
          du -sh $(Build.SourcesDirectory)/*
          df -h
        displayName: Disk Usage after Build
        condition: always()

    - ${{ if and(eq(parameters.isOfficialBuild, true), eq(parameters.osGroup, 'windows')) }}:
      - powershell: ./eng/collect_vsinfo.ps1 -ArchiveRunName postbuild_log
        displayName: Collect vslogs on exit
        condition: always()

parameters:
  enabled: false
  archType: ''
  osGroup: ''
  osSubgroup: ''
  buildConfig: ''
  runtimeFlavor: ''
  runtimeVariant: ''
  helixQueues: ''
  targetRid: ''
  nameSuffix: ''
  platform: ''
  shouldContinueOnError: false

steps:
- ${{ if and(parameters.enabled, eq(parameters.platform, 'linux_x64'), eq(variables['System.TeamProject'], 'public')) }}:
  # Persist completed entries only. Input snapshots are recreated in each job.
  - task: Cache@2
    displayName: Helix shadow result cache
    continueOnError: true
    inputs:
      key: '"helix-results" | "v1" | "linux-x64" | "System.Memory.Data.Tests" | "${{ parameters.buildConfig }}" | "$(Build.BuildId)"'
      path: $(Pipeline.Workspace)/.helix-cache/entries
      restoreKeys: |
        "helix-results" | "v1" | "linux-x64" | "System.Memory.Data.Tests" | "${{ parameters.buildConfig }}"

  - script: |
      set -euo pipefail
      dotnet="$(Build.SourcesDirectory)/.dotnet/dotnet"
      project="$(Build.SourcesDirectory)/src/tools/helix-cache"
      output="$(Build.SourcesDirectory)/artifacts/log/$(_BuildConfig)/helix-cache-shadow"
      cache="$(Pipeline.Workspace)/.helix-cache"
      mkdir -p "$cache/entries"

      "$dotnet" publish "$project/HelixCache.csproj" -c Release -r linux-x64 \
        -o "$(Build.SourcesDirectory)/artifacts/tools/helix-cache"
      executable="$(Build.SourcesDirectory)/artifacts/tools/helix-cache/helix-cache"
      python3 "$project/tests/test_cache.py" "$executable"

      "$dotnet" msbuild "$(Build.SourcesDirectory)/src/libraries/sendtohelix.proj" \
        -t:PrepareCorrelationPayloadDirectory -p:Configuration=$(_BuildConfig) -p:RuntimeFlavor=CoreCLR
      settings="$("$dotnet" msbuild "$(Build.SourcesDirectory)/src/libraries/sendtohelix.proj" \
        -nologo -p:Configuration=$(_BuildConfig) -getProperty:NetCoreAppCurrentBuildSettings)"
      archives="$("$dotnet" msbuild "$(Build.SourcesDirectory)/src/libraries/System.Memory.Data/tests/System.Memory.Data.Tests.csproj" \
        -nologo -p:Configuration=$(_BuildConfig) -getProperty:TestArchiveTestsDir)"
      python3 "$project/shadow.py" prepare \
        --executable "$executable" --cache "$cache" --output "$output" \
        --payload "$archives/System.Memory.Data.Tests.zip" \
        --runtime "$(Build.SourcesDirectory)/artifacts/helix/runtime/test-runtime-$settings.zip" \
        --queue AzureLinux.3.Amd64.Open

      # A cache hit never bypasses this submission.
      "$dotnet" msbuild "$project/Shadow.proj" -t:Submit \
        -p:HelixCacheShadowDirectory="$output" -p:ShadowCreator=dotnet-bot
      python3 "$project/shadow.py" collect \
        --executable "$executable" --cache "$cache" --output "$output"
    displayName: Validate Helix cache in shadow mode (always execute)
    continueOnError: true
    timeoutInMinutes: 75

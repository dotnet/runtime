# Runtime products for diagnostic tests.
trigger: none
pr: none

variables:
  - template: /eng/pipelines/common/variables.yml

extends:
  template: /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    isOfficialBuild: false
    stages:
    - stage: Build
      displayName: Build diagnostics test products
      jobs:
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          platforms:
          - windows_x86
          - windows_x64
          - windows_arm64
          - linux_x64
          - linux_arm
          - linux_arm64
          - linux_musl_x64
          - linux_musl_arm
          - linux_musl_arm64
          - osx_x64
          - osx_arm64
          jobParameters:
            nameSuffix: Diagnostics_CoreCLR
            buildArgs: -s clr+libs+host.tools+host.pkg+packs.product+tools.cdac -c $(_BuildConfig) /p:DotNetBuildTests=false
            timeoutInMinutes: 180
            postBuildSteps:
            - template: /eng/pipelines/common/upload-artifact-step.yml
              parameters:
                rootFolder: $(Build.SourcesDirectory)/artifacts/packages
                includeRootFolder: false
                archiveType: $(archiveType)
                archiveExtension: $(archiveExtension)
                tarCompression: $(tarCompression)
                artifactName: RuntimeArtifacts_CoreCLR_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                displayName: CoreCLR runtime packages

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - windows_x86
          - windows_x64
          - windows_arm64
          - osx_x64
          - osx_arm64
          jobParameters:
            nameSuffix: Diagnostics_CheckedCoreCLR
            buildArgs: -s clr.runtime+clr.corelib -c $(_BuildConfig)
            timeoutInMinutes: 120
            postBuildSteps:
            - template: /eng/pipelines/common/upload-artifact-step.yml
              parameters:
                rootFolder: $(Build.SourcesDirectory)/artifacts/bin/coreclr
                includeRootFolder: true
                archiveType: $(archiveType)
                archiveExtension: $(archiveExtension)
                tarCompression: $(tarCompression)
                artifactName: CoreCLR_BuildArtifacts_$(osGroup)_$(archType)_$(_BuildConfig)
                displayName: Checked CoreCLR products

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          runtimeFlavor: mono
          platforms:
          - linux_x64
          jobParameters:
            nameSuffix: Diagnostics_Mono
            buildArgs: -s mono+libs+packs.product -c $(_BuildConfig) /p:DotNetBuildTests=false
            timeoutInMinutes: 180
            postBuildSteps:
            - template: /eng/pipelines/common/upload-artifact-step.yml
              parameters:
                rootFolder: $(Build.SourcesDirectory)/artifacts/packages
                includeRootFolder: false
                archiveType: $(archiveType)
                archiveExtension: $(archiveExtension)
                tarCompression: $(tarCompression)
                artifactName: RuntimeArtifacts_Mono_$(osGroup)_$(archType)_$(_BuildConfig)
                displayName: Mono runtime packages

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          runtimeFlavor: mono
          platforms:
          - browser_wasm_win
          jobParameters:
            nameSuffix: Diagnostics_Mono_Browser
            buildArgs: -s mono+libs+packs.product -c $(_BuildConfig) /p:BrowserHost=$(_hostedOs) /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOs) /p:WasmEnableThreads=false /p:DotNetBuildTests=false
            timeoutInMinutes: 180
            postBuildSteps:
            - task: CopyFiles@2
              displayName: Stage browser runtime packages
              inputs:
                SourceFolder: $(Build.SourcesDirectory)/artifacts
                Contents: |
                  packages/Release/Shipping/**
                  packages/Release/NonShipping/**
                TargetFolder: $(Build.ArtifactStagingDirectory)/DiagnosticsBrowser
                CleanTargetFolder: true
            - task: PublishPipelineArtifact@1
              displayName: Publish browser runtime packages
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)/DiagnosticsBrowser
                artifactName: BuildArtifacts_browser_wasm_windows_Release_SingleThreaded_BuildOnly

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          platforms:
          - android_x64
          jobParameters:
            nameSuffix: Diagnostics_CoreCLR
            buildArgs: -s clr.runtime+clr.alljits+clr.corelib+clr.nativecorelib+clr.tools+clr.packages+libs+packs.product -c $(_BuildConfig) /p:DotNetBuildTests=false
            timeoutInMinutes: 180
            postBuildSteps:
            - template: /eng/pipelines/common/upload-artifact-step.yml
              parameters:
                rootFolder: $(Build.SourcesDirectory)/artifacts/packages
                includeRootFolder: false
                archiveType: $(archiveType)
                archiveExtension: $(archiveExtension)
                tarCompression: $(tarCompression)
                artifactName: RuntimeArtifacts_CoreCLR_$(osGroup)_$(archType)_$(_BuildConfig)
                displayName: Android CoreCLR runtime packages

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          platforms:
          - iossimulator_arm64
          jobParameters:
            nameSuffix: Diagnostics_CoreCLR
            buildArgs: -s clr+libs+packs.product -c $(_BuildConfig) /p:UseMonoRuntime=false /p:UseNativeAOTRuntime=false /p:UsePortableRuntimePack=false /p:DotNetBuildTests=false
            timeoutInMinutes: 300
            postBuildSteps:
            - template: /eng/pipelines/common/upload-artifact-step.yml
              parameters:
                rootFolder: $(Build.SourcesDirectory)/artifacts/packages
                includeRootFolder: false
                archiveType: $(archiveType)
                archiveExtension: $(archiveExtension)
                tarCompression: $(tarCompression)
                artifactName: RuntimeArtifacts_CoreCLR_$(osGroup)_$(archType)_$(_BuildConfig)
                displayName: iOS Simulator CoreCLR runtime packages

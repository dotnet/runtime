# This contains only wasm-specific jobs
# Run the full trimmed CoreCLR ReadyToRun library tests with
#   /azp run runtime-wasm-libtests

parameters:
  isExtraPlatformsBuild: false
  isWasmOnlyBuild: false
  useHelixMonitor: false
  excludeLibTests: false
  excludeNonLibTests: false
  excludeOptional: true
  debuggerTestsOnly: false
  runFullR2RLibraryTests: false

jobs:

- ${{ if and(ne(parameters.isExtraPlatformsBuild, true), ne(parameters.excludeLibTests, true), ne(parameters.debuggerTestsOnly, true)) }}:
  # Full trimmed CoreCLR ReadyToRun library tests, available through runtime-wasm-libtests.
  - ${{ if eq(parameters.runFullR2RLibraryTests, true) }}:
    - template: /eng/pipelines/common/templates/wasm-coreclr-library-tests.yml
      parameters:
        platforms:
          - browser_wasm
        nameSuffix: _R2R
        readyToRun: true
        timeoutInMinutes: 480
        extraBuildArgs: /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS)
        isExtraPlatformsBuild: ${{ parameters.isExtraPlatformsBuild }}
        isWasmOnlyBuild: ${{ parameters.isWasmOnlyBuild }}
        alwaysRun: true
        useHelixMonitor: ${{ parameters.useHelixMonitor }}
        scenarios:
          - WasmTestOnChrome

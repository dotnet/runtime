# Manual CoreCLR Wasm tests and their workload-package producers.
#   /azp run runtime-wasm
# Run the full trimmed CoreCLR ReadyToRun library tests with
#   /azp run runtime-wasm-libtests

parameters:
  isExtraPlatformsBuild: false
  isWasmOnlyBuild: false
  useHelixMonitor: false
  excludeLibTests: false
  excludeNonLibTests: false
  debuggerTestsOnly: false
  runFullR2RLibraryTests: false

jobs:

# Manual library entry point; retain the existing full R2R suites.
- ${{ if and(ne(parameters.isExtraPlatformsBuild, true), ne(parameters.excludeLibTests, true), ne(parameters.debuggerTestsOnly, true)) }}:
  # Full trimmed CoreCLR ReadyToRun library tests, available through runtime-wasm-libtests.
  - ${{ if eq(parameters.runFullR2RLibraryTests, true) }}:
    - template: /eng/pipelines/common/templates/wasm-coreclr-library-tests.yml
      parameters:
        platforms:
          - browser_wasm
        nameSuffix: _R2R
        readyToRun: true
        timeoutInMinutes: 480
        extraBuildArgs: /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS)
        isExtraPlatformsBuild: ${{ parameters.isExtraPlatformsBuild }}
        isWasmOnlyBuild: ${{ parameters.isWasmOnlyBuild }}
        alwaysRun: true
        useHelixMonitor: ${{ parameters.useHelixMonitor }}
        scenarios:
          - WasmTestOnChrome

    - template: /eng/pipelines/common/templates/wasi-wasm-coreclr-library-tests.yml
      parameters:
        platforms:
          - wasi_wasm
        nameSuffix: _R2R
        readyToRun: true
        timeoutInMinutes: 480
        isExtraPlatformsBuild: ${{ parameters.isExtraPlatformsBuild }}
        isWasmOnlyBuild: ${{ parameters.isWasmOnlyBuild }}
        alwaysRun: true
        useHelixMonitor: ${{ parameters.useHelixMonitor }}

- ${{ if and(ne(parameters.isExtraPlatformsBuild, true), ne(parameters.excludeNonLibTests, true), ne(parameters.debuggerTestsOnly, true)) }}:
  # CoreCLR runtime/crossgen2 packs, shared workload tooling, and the WBT archive.
  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      buildConfig: Release
      platforms:
        - browser_wasm
        - browser_wasm_win
      jobParameters:
        nameSuffix: CoreCLR
        buildArgs: -s clr+libs+libs.tests+packs -c Release -rc $(_BuildConfig) /p:TestAssemblies=false /p:TestWasmBuildTests=true /p:ArchiveTests=true /p:InstallWorkloadForTesting=false /p:BuildCrossgen2HostPackForWorkloadTesting=true
        timeoutInMinutes: 120
        postBuildSteps:
          - template: /eng/pipelines/common/wasm-post-build-steps.yml
            parameters:
              publishArtifactsForWorkload: true
              publishWBT: true
        extraVariablesTemplates:
          - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
            parameters:
              testGroup: innerloop
              liveLibrariesBuildConfig: Release

  # Browser Wasm.Build.Tests
  - template: /eng/pipelines/common/templates/browser-wasm-coreclr-build-tests.yml
    parameters:
      platforms:
        - browser_wasm
        - browser_wasm_win
      extraBuildArgs: /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS)
      alwaysRun: true
      isExtraPlatformsBuild: ${{ parameters.isExtraPlatformsBuild }}
      isWasmOnlyBuild: ${{ parameters.isWasmOnlyBuild }}
      useHelixMonitor: ${{ parameters.useHelixMonitor }}

  - template: /eng/pipelines/common/templates/browser-wasm-coreclr-runtime-tests.yml
    parameters:
      platforms:
        - browser_wasm
      isExtraPlatformsBuild: ${{ parameters.isExtraPlatformsBuild }}
      useHelixMonitor: ${{ parameters.useHelixMonitor }}

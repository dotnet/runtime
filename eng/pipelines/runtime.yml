# Test-only Apple simulator/MacCatalyst scouting pipeline. Do not merge.
trigger: none

pr:
  branches:
    include:
    - main

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: isRunSmokeTestsOnly
    value: false
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml
  - name: helix_macos_ios_simulator_arm64
    value: osx.amd64.iphone.scouting.open

extends:
  template: /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    isOfficialBuild: false
    stages:
    - stage: Build
      variables:
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - group: DotNet-HelixApi-Access
      jobs:
      - template: /eng/common/core-templates/job/helix-job-monitor.yml
        parameters:
          helixAccessToken: $(HelixApiAccessToken)
          timeoutInMinutes: 540

      # The scouting workers are Apple M1 hosts despite the legacy amd64 queue names.
      - ${{ each target in split('iossimulator,maccatalyst', ',') }}:
        - ${{ each runtime in split('CoreCLR,NativeAOT', ',') }}:
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
              buildConfig: Release
              runtimeFlavor: coreclr
              platforms:
                - ${{ format('{0}_arm64', target) }}
              variables:
                - name: _devTeamProvisioning
                  ${{ if eq(target, 'iossimulator') }}:
                    value: '-'
                  ${{ else }}:
                    value: adhoc
                # Both platforms share this queue alias in the existing submission templates.
                - ${{ if eq(target, 'maccatalyst') }}:
                  - name: helix_macos_ios_simulator_arm64
                    value: osx.amd64.appletv.scouting.open
              jobParameters:
                testGroup: innerloop
                nameSuffix: ${{ format('AllSubsets_{0}', runtime) }}
                ${{ if eq(runtime, 'NativeAOT') }}:
                  buildArgs: --cross -s clr.alljits+clr.tools+clr.nativeaotruntime+clr.nativeaotlibs+libs+libs.tests -c $(_BuildConfig) /p:ArchiveTests=true $(_runSmokeTestsOnlyArg) /p:DevTeamProvisioning=$(_devTeamProvisioning) /p:BuildTestsOnHelix=true /p:UseNativeAOTRuntime=true /p:RunAOTCompilation=false /p:ContinuousIntegrationBuild=true
                ${{ else }}:
                  buildArgs: -s clr+clr.runtime+libs+packs+libs.tests -c $(_BuildConfig) /p:ArchiveTests=true $(_runSmokeTestsOnlyArg) /p:DevTeamProvisioning=$(_devTeamProvisioning) /p:UseMonoRuntime=false /p:UseNativeAOTRuntime=false /p:BuildTestsOnHelix=true /p:EnableAdditionalTimezoneChecks=true /p:UsePortableRuntimePack=false /p:EnableAggressiveTrimming=true
                timeoutInMinutes: 360
                postBuildSteps:
                  - template: /eng/pipelines/libraries/helix.yml
                    parameters:
                      creator: dotnet-bot
                      testRunNamePrefixSuffix: ${{ runtime }}_$(_BuildConfig)
                      testScope: innerloop
                      useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                      extraHelixArguments: /p:NeedsToBuildAppsOnHelix=true

          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
              buildConfig: Release
              runtimeFlavor: coreclr
              platforms:
                - ${{ format('{0}_arm64', target) }}
              variables:
                - ${{ if and(eq(variables['System.TeamProject'], 'public'), eq(variables['Build.Reason'], 'PullRequest')) }}:
                  - name: _HelixSource
                    value: pr/dotnet/runtime/$(Build.SourceBranch)
                - ${{ if and(eq(variables['System.TeamProject'], 'public'), ne(variables['Build.Reason'], 'PullRequest')) }}:
                  - name: _HelixSource
                    value: ci/dotnet/runtime/$(Build.SourceBranch)
                - name: timeoutPerTestInMinutes
                  value: 60
                - name: timeoutPerTestCollectionInMinutes
                  value: 180
                - name: _devTeamProvisioning
                  ${{ if eq(target, 'iossimulator') }}:
                    value: '-'
                  ${{ else }}:
                    value: adhoc
                - ${{ if eq(target, 'maccatalyst') }}:
                  - name: helix_macos_ios_simulator_arm64
                    value: osx.amd64.appletv.scouting.open
              jobParameters:
                testGroup: innerloop
                nameSuffix: ${{ format('AllSubsets_{0}_RuntimeTests', runtime) }}
                ${{ if eq(runtime, 'NativeAOT') }}:
                  buildArgs: --cross -s clr.alljits+clr.tools+clr.nativeaotruntime+clr.nativeaotlibs+libs -c $(_BuildConfig)
                ${{ else }}:
                  buildArgs: -s clr+libs -c $(_BuildConfig)
                timeoutInMinutes: 480
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                    parameters:
                      testGroup: innerloop
                      useNativeAOTRuntime: ${{ eq(runtime, 'NativeAOT') }}
                postBuildSteps:
                  - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                    parameters:
                      creator: dotnet-bot
                      ${{ if eq(runtime, 'NativeAOT') }}:
                        testBuildArgs: /p:DevTeamProvisioning=$(_devTeamProvisioning) /p:UseMonoRuntime=false /p:UseNativeAOTRuntime=true /p:BuildNativeAOTRuntimePack=true /p:BuildTestsOnHelix=true
                        extraHelixArguments: /p:NeedsToBuildAppsOnHelix=true /p:TestBuildMode=nativeaot /p:UseNativeAOTRuntime=true /p:BuildNativeAOTRuntimePack=true
                      ${{ else }}:
                        testBuildArgs: /p:DevTeamProvisioning=$(_devTeamProvisioning) /p:UseMonoRuntime=false /p:UseNativeAOTRuntime=false /p:BuildTestsOnHelix=true
                        extraHelixArguments: /p:NeedsToBuildAppsOnHelix=true
                      testRunNamePrefixSuffix: ${{ runtime }}_$(_BuildConfig)
                      useHelixMonitor: ${{ variables.enableHelixJobMonitor }}

# Setting batch to true, triggers one build at a time.
# if there is a push while a build in progress, it will wait,
# until the running build finishes, and produce a build with all the changes
# that happened during the last build.
trigger:
  batch: true
  branches:
    include:
    - release/*.*
  paths:
    include:
    - '*'
    exclude:
    - '**.md'
    - eng/Version.Details.xml
    - .devcontainer/*
    - .github/*
    - docs/*
    - LICENSE.TXT
    - PATENTS.TXT
    - THIRD-PARTY-NOTICES.TXT
    - eng/pipelines/performance/*
    - eng/testing/performance/*

schedules:
  - cron: "0 8,20 * * *" # run at 8:00 and 20:00 (UTC) which is 00:00 and 12:00 (PST).
    displayName: Runtime default schedule
    branches:
      include:
      - main
    always: false # run only if there were changes since the last successful scheduled run.

pr:
  branches:
    include:
    - '*'
  paths:
    include:
    - '*'
    exclude:
    - '**.md'
    - eng/Version.Details.xml
    - .devcontainer/*
    - .github/*
    - docs/*
    - LICENSE.TXT
    - PATENTS.TXT
    - THIRD-PARTY-NOTICES.TXT

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: false
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    isOfficialBuild: false
    stages:
    - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      - stage: EvaluatePaths
        displayName: Evaluate Paths
        jobs:
          - template: /eng/pipelines/common/evaluate-default-paths.yml

    - stage: Build
      jobs:
      - ${{ if eq(variables['enableHelixJobMonitor'], true) }}:
        - template: /eng/common/core-templates/job/helix-job-monitor.yml
          parameters:
            helixAccessToken: $(HelixApiAccessToken)
            timeoutInMinutes: 540
            # Some path-filtered builds intentionally submit no Helix jobs.
            allowNoHelixJobs: true

      #
      # Build CoreCLR verticals
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - linux_musl_arm
          - linux_musl_arm64
          - windows_arm64
          - linux_arm
          jobParameters:
            nameSuffix: AllSubsets_CoreCLR_ReleaseRuntimeLibs
            buildArgs: -s clr+libs+host+packs -rc Release -lc Release -c $(_BuildConfig)
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_non_mono_and_wasm.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - linux_arm64
          - linux_musl_x64
          jobParameters:
            nameSuffix: AllSubsets_CoreCLR
            buildArgs: -s clr+libs+host+packs -rc Release -c Release -lc $(_BuildConfig)
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_non_mono_and_wasm.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # Release build of browser wasm for WBT
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          platforms:
          - browser_wasm
          - browser_wasm_win
          jobParameters:
            nameSuffix: CoreCLR
            buildArgs: -s clr+libs+libs.tests+packs -c Release -rc $(_BuildConfig) /p:TestAssemblies=false /p:TestWasmBuildTests=true /p:ArchiveTests=true /p:InstallWorkloadForTesting=false
            timeoutInMinutes: 120
            postBuildSteps:
              - template: /eng/pipelines/common/wasm-post-build-steps.yml
                parameters:
                  publishArtifactsForWorkload: true
                  publishWBT: true
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                parameters:
                  testGroup: innerloop
                  liveLibrariesBuildConfig: Release
            condition: >-
              or(
                eq(variables['wasmDarcDependenciesChanged'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasmbuildtests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # Release build of wasi wasm for CoreCLR (build-only — the
      # runtime tests run in a separate job dispatched to Helix from
      # wasi-wasm-coreclr-runtime-tests.yml below).
      - template: /eng/pipelines/common/templates/wasi-wasm-coreclr-build-only.yml
        parameters:
          platforms:
          - wasi_wasm
          publishArtifactsForWorkload: true
          condition: >-
            or(
              eq(variables['wasmDarcDependenciesChanged'], true),
              eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
              eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
              eq(variables['isRollingBuild'], true))

      # CoreCLR src/tests subset run on wasmtime via Helix
      # (wasi_wasm queue -> ubuntu-26.04-helix-webassembly-amd64 image).
      - template: /eng/pipelines/common/templates/wasi-wasm-coreclr-runtime-tests.yml
        parameters:
          platforms:
          - wasi_wasm
          alwaysRun: ${{ variables.isRollingBuild }}
          useHelixMonitor: ${{ variables.enableHelixJobMonitor }}

      # CoreCLR library-test smoke leg run on wasmtime via Helix
      # (wasi_wasm queue). Starts with a single-library smoke set; see
      # https://github.com/dotnet/runtime/issues/130129.
      - template: /eng/pipelines/common/templates/wasi-wasm-coreclr-library-tests.yml
        parameters:
          platforms:
          - wasi_wasm
          shouldRunSmokeOnly: true
          alwaysRun: ${{ variables.isRollingBuild }}
          useHelixMonitor: ${{ variables.enableHelixJobMonitor }}

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - browser_wasm
          jobParameters:
            nameSuffix: CoreCLR_ReleaseLibraries
            buildArgs: -s clr+libs+libs.tests+packs -c Release -rc $(_BuildConfig) /p:TestAssemblies=false /p:ArchiveTests=true /p:InstallWorkloadForTesting=false
            timeoutInMinutes: 120
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
                parameters:
                  extraBuildArgs: -os browser
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
                  displayName: Build Assets
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/helix
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: CoreCLR_ReleaseLibraries_TestArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
              - template: /eng/pipelines/common/wasm-post-build-steps.yml
                parameters:
                  publishArtifactsForWorkload: true
                  publishWBT: true
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                parameters:
                  testGroup: innerloop
                  liveLibrariesBuildConfig: Release
              - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
                parameters:
                  testGroup: innerloop
            condition: >-
              or(
                eq(variables['wasmDarcDependenciesChanged'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - browser_wasm_win
          jobParameters:
            nameSuffix: CoreCLR_ReleaseLibraries
            buildArgs: -s clr+libs+libs.tests+packs -c Release -rc $(_BuildConfig) /p:TestAssemblies=false /p:ArchiveTests=true /p:InstallWorkloadForTesting=false
            timeoutInMinutes: 120
            postBuildSteps:
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
                  displayName: Build Assets
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/helix
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: CoreCLR_ReleaseLibraries_TestArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
              - template: /eng/pipelines/common/wasm-post-build-steps.yml
                parameters:
                  publishArtifactsForWorkload: true
                  publishWBT: true
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                parameters:
                  testGroup: innerloop
                  liveLibrariesBuildConfig: Release
            condition: >-
              or(
                eq(variables['wasmDarcDependenciesChanged'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # Browser Wasm.Build.Tests
      - template: /eng/pipelines/common/templates/browser-wasm-coreclr-build-tests.yml
        parameters:
          platforms:
            - browser_wasm
            - browser_wasm_win
          alwaysRun: ${{ variables.isRollingBuild }}
          extraBuildArgs: /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS)
          useHelixMonitor: ${{ variables.enableHelixJobMonitor }}

      #
      # Build CoreCLR verticals
      # Run libraries tests and installer tests
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - linux_x64
          - linux_musl_x64
          - osx_arm64
          - windows_x64
          variables:
            - name: librariesContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'] ]
            - name: coreclrContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'] ]
            - name: installerContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'] ]
          jobParameters:
            nameSuffix: CoreCLR_AllSubsets
            buildArgs: -s clr+libs+libs.tests+host+packs -rc Release -c $(_BuildConfig) /p:ArchiveTests=true
            timeoutInMinutes: 180
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: coreclr_release
                  testScope: innerloop
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['librariesContainsChange'], true),
                      eq(variables['isRollingBuild'], true))
              - template: /eng/pipelines/installer/helix-queues-setup.yml
                parameters:
                  creator: dotnet-bot
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['installerContainsChange'], true),
                      and(
                        eq(variables['osGroup'], 'osx'),
                        eq(variables['archType'], 'arm64'),
                        eq(variables['coreclrContainsChange'], true)),
                      eq(variables['isRollingBuild'], true))
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_non_mono_and_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: release
          platforms:
          - windows_x86
          variables:
            - name: librariesContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'] ]
            - name: installerContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'] ]
          jobParameters:
            nameSuffix: CoreCLR_AllSubsets
            buildArgs: -s clr+libs+libs.tests+host+packs -c $(_BuildConfig) /p:ArchiveTests=true
            timeoutInMinutes: 180
            postBuildSteps:
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  helixBuildConfig: Release
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: coreclr_release
                  testScope: innerloop
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['librariesContainsChange'], true),
                      eq(variables['isRollingBuild'], true))
              - template: /eng/pipelines/installer/helix-queues-setup.yml
                parameters:
                  creator: dotnet-bot
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['installerContainsChange'], true),
                      eq(variables['isRollingBuild'], true))
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_non_mono_and_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build CoreCLR verticals
      # For running installer tests
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: release
          platforms:
          - osx_x64
          variables:
            - name: installerContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'] ]
          jobParameters:
            nameSuffix: CoreCLR_AllSubsets
            buildArgs: -s clr+libs+host+packs -c $(_BuildConfig)
            timeoutInMinutes: 180
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/installer/helix-queues-setup.yml
                parameters:
                  creator: dotnet-bot
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['installerContainsChange'], true),
                      eq(variables['isRollingBuild'], true))
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_non_mono_and_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build CoreCLR and Libraries with the respective tests
      # for the test configurations we run.
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          helixQueueGroup: libraries
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - linux_arm64
          - osx_arm64
          variables:
            - name: librariesContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'] ]
            - name: coreclrContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'] ]
          jobParameters:
            nameSuffix: Libraries_CheckedCoreCLR
            buildArgs: -s clr+libs+libs.tests -c $(_BuildConfig) -rc Checked /p:ArchiveTests=true
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                  displayName: Build Assets
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: coreclr_checked
                  testScope: innerloop
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['coreclrContainsChange'], true),
                      and(
                        eq(variables['osGroup'], 'osx'),
                        eq(variables['librariesContainsChange'], true)),
                      eq(variables['isRollingBuild'], true))
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
                parameters:
                  testGroup: innerloop
                  configOverride: Checked
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - linux_x64
          - windows_x64
          jobParameters:
            nameSuffix: Libraries_CheckedCoreCLR
            buildArgs: -s clr+clr.wasmjit+libs -c $(_BuildConfig) -rc Checked
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                  displayName: Build Assets
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
                parameters:
                  testGroup: innerloop
                  configOverride: Checked
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          helixQueueGroup: libraries
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - linux_musl_x64
          - windows_x86
          variables:
            - name: coreclrContainsChange
              value: $[ stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'] ]
          jobParameters:
            nameSuffix: Libraries_CheckedCoreCLR
            buildArgs: -s clr+libs+libs.tests -c $(_BuildConfig) -rc Checked /p:ArchiveTests=true
            timeoutInMinutes: 120
            postBuildSteps:
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                  displayName: Build Assets
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: coreclr_checked
                  testScope: innerloop
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  condition: >-
                    or(
                      eq(variables['coreclrContainsChange'], true),
                      eq(variables['isRollingBuild'], true))
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          platforms:
          - osx_x64
          jobParameters:
            nameSuffix: Libraries_CheckedCoreCLR
            buildArgs: -s clr+libs -c $(_BuildConfig) -rc Checked
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                  displayName: Build Assets
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
                parameters:
                  testGroup: innerloop
                  configOverride: Checked
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - linux_arm
          - windows_arm64
          - windows_x86
          jobParameters:
            nameSuffix: CoreCLR_ReleaseLibraries
            buildArgs: -s clr+libs -rc $(_BuildConfig) -c Release
            timeoutInMinutes: 120
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                  displayName: Build Assets
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
                parameters:
                  testGroup: innerloop
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          helixQueueGroup: libraries
          buildConfig: checked
          platforms:
          - linux_x64
          - linux_musl_arm
          - linux_musl_arm64
          - windows_x64
          jobParameters:
            nameSuffix: CoreCLR_ReleaseLibraries
            buildArgs: -s clr+libs+libs.tests -rc $(_BuildConfig) -c Release /p:ArchiveTests=true
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/common/upload-artifact-step.yml
                parameters:
                  rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                  includeRootFolder: false
                  archiveType: $(archiveType)
                  archiveExtension: $(archiveExtension)
                  tarCompression: $(tarCompression)
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                  displayName: Build Assets
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  helixBuildConfig: Release
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: coreclr_checked
                  testScope: innerloop
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build the whole product using GNU compiler toolchain
      # When CoreCLR, Mono, Libraries, Installer and src/tests are changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - gcc_linux_x64
          jobParameters:
            testGroup: innerloop
            nameSuffix: Native_GCC
            buildArgs: -s clr.native+libs.native+mono+host.native -c $(_BuildConfig) -gcc
            postBuildSteps:
              - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests.yml
                parameters:
                  testBuildArgs: skipmanaged skipgeneratelayout skiprestorepackages -gcc
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_mono_excluding_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build CoreCLR and run crossgen on S.P.CoreLib
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: checked
          runtimeFlavor: coreclr
          platforms:
          - linux_x86
          jobParameters:
            testScope: innerloop
            nameSuffix: CoreCLR
            buildArgs: -s clr.runtime+clr.jit+clr.iltools+clr.spmi+clr.corelib+clr.nativecorelib -c $(_BuildConfig)
            timeoutInMinutes: 120
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build CoreCLR as a non-portable build
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: checked
          runtimeFlavor: coreclr
          platforms:
          - tizen_armel
          jobParameters:
            testScope: innerloop
            nameSuffix: CoreCLR_NonPortable
            buildArgs: -s clr.native+clr.tools+clr.corelib+clr.nativecorelib+clr.aot+clr.packages --targetrid tizen.9.0.0-armel -c $(_BuildConfig) /p:PortableBuild=false
            timeoutInMinutes: 120
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build CoreCLR + Libs + Host
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          runtimeFlavor: coreclr
          platforms:
          - freebsd_x64
          - linux_riscv64
          - linux_loongarch64
          - openbsd_x64
          jobParameters:
            testScope: innerloop
            nameSuffix: CoreCLR_Bootstrapped
            buildArgs: -s clr+libs+host+packs+tools.cdac -c $(_BuildConfig) -rc Checked --bootstrap
            timeoutInMinutes: 120
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # CoreCLR NativeAOT debug build and smoke tests
      # Only when CoreCLR is changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          buildConfig: Debug
          platforms:
          - linux_x64
          - windows_x64
          variables:
          - name: timeoutPerTestInMinutes
            value: 60
          - name: timeoutPerTestCollectionInMinutes
            value: 180
          jobParameters:
            timeoutInMinutes: 180
            nameSuffix: NativeAOT
            buildArgs: -s clr.aot+libs -rc $(_BuildConfig) -lc Release /p:RunAnalyzers=false
            postBuildSteps:
              - template: /eng/pipelines/coreclr/nativeaot-post-build-steps.yml
                parameters:
                  creator: dotnet-bot
                  testBuildArgs: nativeaot tree nativeaot
                  liveLibrariesBuildConfig: Release
                  testRunNamePrefixSuffix: NativeAOT_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                parameters:
                  testGroup: innerloop
                  liveLibrariesBuildConfig: Release
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # CoreCLR NativeAOT checked build and smoke tests
      # Only when CoreCLR is changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          buildConfig: Checked
          platforms:
          - windows_x64
          variables:
          - name: timeoutPerTestInMinutes
            value: 60
          - name: timeoutPerTestCollectionInMinutes
            value: 180
          jobParameters:
            timeoutInMinutes: 180
            nameSuffix: NativeAOT
            buildArgs: -s clr.aot+libs.native+libs.sfx -rc $(_BuildConfig) -lc Release /p:RunAnalyzers=false
            postBuildSteps:
              - template: /eng/pipelines/coreclr/nativeaot-post-build-steps.yml
                parameters:
                  creator: dotnet-bot
                  testBuildArgs: 'nativeaot tree ";nativeaot;Loader;Interop;async;" /p:BuildNativeAotFrameworkObjects=true'
                  liveLibrariesBuildConfig: Release
                  testRunNamePrefixSuffix: NativeAOT_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                parameters:
                  testGroup: innerloop
                  liveLibrariesBuildConfig: Release
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # CoreCLR NativeAOT release build and smoke tests
      # Only when CoreCLR is changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          buildConfig: Release
          platforms:
          - linux_x64
          - windows_x64
          - osx_arm64
          - linux_arm64
          - windows_arm64
          variables:
          - name: timeoutPerTestInMinutes
            value: 60
          - name: timeoutPerTestCollectionInMinutes
            value: 180
          jobParameters:
            testGroup: innerloop
            timeoutInMinutes: 180
            nameSuffix: NativeAOT
            buildArgs: -s clr.aot+libs+tools.illink -c $(_BuildConfig) -rc $(_BuildConfig) -lc Release /p:RunAnalyzers=false
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/coreclr/nativeaot-post-build-steps.yml
                parameters:
                  creator: dotnet-bot
                  testBuildArgs: 'nativeaot tree ";nativeaot;tracing/eventpipe/providervalidation;"'
                  liveLibrariesBuildConfig: Release
                  testRunNamePrefixSuffix: NativeAOT_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                parameters:
                  testGroup: innerloop
                  liveLibrariesBuildConfig: Release
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # CoreCLR NativeAOT release build and libraries tests
      # Only when CoreCLR or library is changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: Release
          platforms:
          - windows_arm64
          - linux_arm64
          - osx_arm64
          jobParameters:
            testGroup: innerloop
            isSingleFile: true
            nameSuffix: NativeAOT_Libraries
            buildArgs: -s clr.aot+libs+libs.tests -c $(_BuildConfig) /p:TestNativeAot=true /p:RunSmokeTestsOnly=true /p:ArchiveTests=true /p:RunAnalyzers=false
            timeoutInMinutes: 240 # Doesn't actually take long, but we've seen the ARM64 Helix queue often get backlogged for 2+ hours
            preBuildSteps:
              - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
            # extra steps, run tests
            postBuildSteps:
              - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: NativeAOT_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # Build and test clr tools
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - linux_x64
          jobParameters:
            timeoutInMinutes: 120
            nameSuffix: CLR_Tools_Tests
            buildArgs: -s clr.aot+clr.iltools+clr.corelib+clr.nativecorelib+libs.sfx+clr.toolstests+tools.cdac+tools.cdactests -c $(_BuildConfig) -test
            enablePublishTestResults: true
            testResultsFormat: 'xunit'
            # We want to run AOT tests when illink changes because there's share code and tests from illink which are used by AOT
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_cdac.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # The R2R test suite compiles for one target per run: the test assembly itself always runs on
      # the build machine, while crossgen2 and the shared framework it compiles against are staged
      # for whatever the build targets. Each leg therefore needs only its own target's artifacts,
      # and test cases the target cannot compile are skipped rather than failed.
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - linux_x64
          jobParameters:
            dependsOn:
            - build_linux_x64_checked_CoreCLR_ReleaseLibraries
            timeoutInMinutes: 120
            nameSuffix: CLR_R2R_Tests_linux_x64
            buildArgs: -s clr.r2rtests -lc Release -c $(_BuildConfig) -test
            enablePublishTestResults: true
            testResultsFormat: 'xunit'
            preBuildSteps:
              - template: /eng/pipelines/common/download-artifact-step.yml
                parameters:
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_linux_x64_Checked
                  artifactFileName: CoreCLR_ReleaseLibraries_BuildArtifacts_linux_x64_Checked$(archiveExtension)
                  unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
                  cleanUnpackFolder: false
                  overwriteExistingFiles: true
                  displayName: Download linux-x64 artifacts
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - linux_x64
          variables:
            - name: _osParameter
              value: -os browser
            - name: _archParameter
              value: -arch wasm
          jobParameters:
            dependsOn:
            - build_browser_wasm_linux_checked_CoreCLR_ReleaseLibraries
            timeoutInMinutes: 120
            nameSuffix: CLR_R2R_Tests_browser_wasm
            buildArgs: -s clr.r2rtests -lc Release -c $(_BuildConfig) -test
            enablePublishTestResults: true
            testResultsFormat: 'xunit'
            preBuildSteps:
              - template: /eng/pipelines/common/download-artifact-step.yml
                parameters:
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_browser_wasm_linux_Checked
                  artifactFileName: CoreCLR_ReleaseLibraries_BuildArtifacts_browser_wasm_linux_Checked$(archiveExtension)
                  unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
                  cleanUnpackFolder: false
                  overwriteExistingFiles: true
                  displayName: Download browser-wasm artifacts
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - linux_x64
          variables:
            - name: _archParameter
              value: -arch arm
          jobParameters:
            dependsOn:
            - build_linux_arm_checked_CoreCLR_ReleaseLibraries
            timeoutInMinutes: 120
            nameSuffix: CLR_R2R_Tests_linux_arm
            buildArgs: -s clr.r2rtests -lc Release -c $(_BuildConfig) -test
            enablePublishTestResults: true
            testResultsFormat: 'xunit'
            preBuildSteps:
              - template: /eng/pipelines/common/download-artifact-step.yml
                parameters:
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_linux_arm_Checked
                  artifactFileName: CoreCLR_ReleaseLibraries_BuildArtifacts_linux_arm_Checked$(archiveExtension)
                  unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
                  cleanUnpackFolder: false
                  overwriteExistingFiles: true
                  displayName: Download linux-arm artifacts
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - linux_x64
          variables:
            - name: _osParameter
              value: -os ios
            - name: _archParameter
              value: -arch arm64
          jobParameters:
            timeoutInMinutes: 120
            nameSuffix: CLR_R2R_Tests_ios_arm64
            # No prebuilt artifact can supply this leg: the iOS jobs run on macOS, so their cross
            # components are Mach-O and unusable here. The cross components are built from source
            # instead - they target the build host (linux-x64), not iOS, so no Apple SDK is needed.
            # libs.sfx rather than libs, because libs.native does require the Apple SDK.
            buildArgs: -s clr.crossarchtools+clr.corelib+libs.sfx -rf CoreCLR -lc Release -c $(_BuildConfig)
            enablePublishTestResults: true
            testResultsFormat: 'xunit'
            postBuildSteps:
              # A separate invocation because clr.r2rtests is ordered ahead of libs.sfx in
              # Subsets.props, so a single build would run the tests before their inputs exist.
              - template: /eng/pipelines/common/templates/global-build-step.yml
                parameters:
                  buildArgs: -s clr.r2rtests -rf CoreCLR -lc Release -c $(_BuildConfig) -test
                  displayName: Build and run R2R tests
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # The only leg with a Windows host, which the two --pdb test cases require: crossgen2 writes
      # Windows PDBs through Microsoft.DiaSymReader.Native, which is restored for Windows only.
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: checked
          platforms:
          - windows_x64
          jobParameters:
            dependsOn:
            - build_windows_x64_checked_CoreCLR_ReleaseLibraries
            timeoutInMinutes: 120
            nameSuffix: CLR_R2R_Tests_windows_x64
            buildArgs: -s clr.r2rtests -lc Release -c $(_BuildConfig) -test
            enablePublishTestResults: true
            testResultsFormat: 'xunit'
            preBuildSteps:
              - template: /eng/pipelines/common/download-artifact-step.yml
                parameters:
                  artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_windows_x64_Checked
                  artifactFileName: CoreCLR_ReleaseLibraries_BuildArtifacts_windows_x64_Checked$(archiveExtension)
                  unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
                  cleanUnpackFolder: false
                  overwriteExistingFiles: true
                  displayName: Download windows-x64 artifacts
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # Build CrossDacs
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: release
          platforms:
          - windows_x64
          variables:
            - name: _archParameter
              value: -arch x64,x86,arm,arm64
          jobParameters:
            buildArgs: -s linuxdac+alpinedac -c Checked,$(_BuildConfig)
            nameSuffix: CrossDac
            isOfficialBuild: false
            timeoutInMinutes: 60
            postBuildSteps:
            - publish: $(Build.SourcesDirectory)/artifacts/bin/coreclr
              displayName: Publish CrossDacs for diagnostics
              artifact: CoreCLRCrossDacArtifacts
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_non_mono_and_wasm.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # Build Mono AOT offset headers once, for validation
      # Only when mono changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: release
          platforms:
          - browser_wasm
          - wasi_wasm
          variables:
            - name: _osParameter
              value: -os linux
            - name: _archParameter
              value: -arch x64
          jobParameters:
            nameSuffix: MonoAOTOffsets
            buildArgs: -s mono.aotcross -c $(_BuildConfig) /p:MonoGenerateOffsetsOSGroups=$(osGroup) /p:ValidateMonoOffsets=true
            postBuildSteps:
              # Upload offset files
              - task: CopyFiles@2
                displayName: Collect offset files
                condition: failed()
                inputs:
                  sourceFolder: '$(Build.SourcesDirectory)/src/mono/mono/offsets'
                  contents: '*.h.new'
                  targetFolder: '$(Build.SourcesDirectory)/artifacts/obj/mono/offsetfiles/'

              - publish: '$(Build.SourcesDirectory)/artifacts/obj/mono/offsetfiles'
                condition: failed()
                artifact: MonoAOTOffsets_$(osGroup)$(osSubGroup)
                displayName: Upload offset files
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_mono_excluding_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      # Build the whole product using Mono runtime
      # Only when libraries, mono or installer are changed
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
          runtimeFlavor: mono
          platforms:
          - linux_x64
          - linux_arm
          - linux_arm64
          jobParameters:
            testGroup: innerloop
            nameSuffix: AllSubsets_Mono
            buildArgs: -s mono+libs+host+packs -c $(_BuildConfig)
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_mono_excluding_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          runtimeFlavor: mono
          platforms:
          - linux_musl_x64
          - osx_x64
          jobParameters:
            testGroup: innerloop
            nameSuffix: AllSubsets_Mono
            buildArgs: -s mono+libs+host+packs -c $(_BuildConfig)
            condition: >-
              or(
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_mono_excluding_wasm.containsChange'], true),
                eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_installer.containsChange'], true),
                eq(variables['isRollingBuild'], true))

      #
      # WebAssembly legs
      #
      - template: /eng/pipelines/common/templates/wasm-library-tests.yml
        parameters:
          platforms:
            - browser_wasm
          alwaysRun: ${{ variables.isRollingBuild }}
          extraBuildArgs: /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS)
          useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
          scenarios:
            - WasmTestOnChrome
            - WasmTestOnFirefox

      - template: /eng/pipelines/common/templates/wasm-library-tests.yml
        parameters:
          platforms:
            - browser_wasm_win
          alwaysRun: ${{ variables.isRollingBuild }}
          extraBuildArgs: /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS)
          useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
          scenarios:
            - WasmTestOnChrome

      - template: /eng/pipelines/common/templates/wasm-library-tests.yml
        parameters:
          platforms:
            - browser_wasm_mac
          alwaysRun: ${{ variables.isRollingBuild }}
          runOnlyOnChromeVersionUpdate: true
          shouldRunSmokeOnly: 'true'
          nameSuffix: _SmokeMac
          extraBuildArgs: /p:AotHostArchitecture=arm64 /p:AotHostOS=$(_hostedOS)
          useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
          scenarios:
            - WasmTestOnChrome


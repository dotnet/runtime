# Test-only smoke pipeline for Apple device scouting queues. Do not merge.
trigger: none

pr:
  branches:
    include:
    - main

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: isRunSmokeTestsOnly
    value: true
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml
  - name: helix_macos_ios_device
    value: osx.amd64.iphone.scouting.open
  - name: helix_macos_tvos_device
    value: osx.amd64.appletv.scouting.open

extends:
  template: /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    isOfficialBuild: false
    stages:
    - stage: Build
      variables:
      # The standalone monitor does not inherit the submitter jobs' variable groups.
      - ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest')) }}:
        - group: DotNet-HelixApi-Access
      jobs:
      - template: /eng/common/core-templates/job/helix-job-monitor.yml
        parameters:
          helixAccessToken: $(HelixApiAccessToken)
          timeoutInMinutes: 540

      # Build NativeAOT and run device library smoke tests.
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: Release
          runtimeFlavor: coreclr
          platforms:
            - ios_arm64
            - tvos_arm64
          jobParameters:
            testGroup: innerloop
            nameSuffix: AllSubsets_NativeAOT_Smoke
            buildArgs: --cross -s clr.alljits+clr.tools+clr.nativeaotruntime+clr.nativeaotlibs+libs+libs.tests -c $(_BuildConfig) /p:ArchiveTests=true $(_runSmokeTestsOnlyArg) /p:DevTeamProvisioning=- /p:BuildTestsOnHelix=true /p:UseNativeAOTRuntime=true /p:RunAOTCompilation=false /p:ContinuousIntegrationBuild=true
            timeoutInMinutes: 360
            useNativeAOTRuntime: true
            postBuildSteps:
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: NativeAOT_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  extraHelixArguments: /p:NeedsToBuildAppsOnHelix=true

      # Build CoreCLR and run iOS library smoke tests.
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: Release
          runtimeFlavor: coreclr
          platforms:
            - ios_arm64
          jobParameters:
            testGroup: innerloop
            nameSuffix: AllSubsets_CoreCLR_Smoke
            buildArgs: -s clr+clr.runtime+libs+packs+libs.tests -c $(_BuildConfig) /p:ArchiveTests=true /p:DevTeamProvisioning=- /p:UseMonoRuntime=false /p:UseNativeAOTRuntime=false $(_runSmokeTestsOnlyArg) /p:BuildTestsOnHelix=true /p:UsePortableRuntimePack=false
            timeoutInMinutes: 240
            postBuildSteps:
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: CoreCLR_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  extraHelixArguments: /p:NeedsToBuildAppsOnHelix=true

      # Build CoreCLR and run tvOS library smoke tests.
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: Release
          runtimeFlavor: coreclr
          platforms:
            - tvos_arm64
          jobParameters:
            testGroup: innerloop
            nameSuffix: AllSubsets_CoreCLR_Smoke
            buildArgs: -s clr+clr.runtime+libs+packs+libs.tests -c $(_BuildConfig) /p:ArchiveTests=true /p:DevTeamProvisioning=- /p:UseMonoRuntime=false /p:UseNativeAOTRuntime=false $(_runSmokeTestsOnlyArg) /p:BuildTestsOnHelix=true /p:EnableAdditionalTimezoneChecks=true /p:UsePortableRuntimePack=false /p:EnableAggressiveTrimming=true
            timeoutInMinutes: 240
            postBuildSteps:
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: CoreCLR_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  extraHelixArguments: /p:NeedsToBuildAppsOnHelix=true

parameters:
- name: runPrivateJobs
  type: boolean
  default: false
- name: runScheduledJobs
  type: boolean
  default: false
- name: onlySanityCheck
  type: boolean
  default: false

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*.0
  paths:
    include:
    - '*'
    exclude:
    - '**.md'
    - .devcontainer/*
    - .github/*
    - docs/*
    - LICENSE.TXT
    - PATENTS.TXT
    - THIRD-PARTY-NOTICES.TXT

resources:
  repositories:
    - repository: performance
      type: git
      name: internal/dotnet-performance

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true

schedules:
- cron: "30 2 * * *"
  displayName: Every night at 2:30AM
  branches:
    include:
    - main
  always: true

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - stage: Build
      variables:
      # The standalone monitor does not inherit the submitter jobs' variable groups.
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - group: DotNet-HelixApi-Access
      jobs:
      - template: /eng/common/core-templates/job/helix-job-monitor.yml
        parameters:
          helixAccessToken: $(HelixApiAccessToken)
          timeoutInMinutes: 540
          allowNoHelixJobs: true

      - ${{ if ne(variables['System.TeamProject'], 'public') }}:
        - template: /eng/pipelines/runtime-slow-perf-jobs.yml@performance
          parameters:
            ${{ if or(in(variables['Build.Reason'], 'Schedule'), parameters.runScheduledJobs) }}:
              runScheduledJobs: true
            ${{ if or(notin(variables['Build.Reason'], 'Schedule', 'Manual'), parameters.runPrivateJobs) }}:
              runPrivateJobs: true
            runtimeRepoAlias: self
            performanceRepoAlias: performance
            jobParameters:
              ${{ if parameters.onlySanityCheck }}:
                onlySanityCheck: true

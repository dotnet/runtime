parameters:
  archType: ''
  condition: always()
  creator: ''
  includeAllPlatforms: false
  isExtraPlatformsBuild: false
  osGroup: ''
  osSubgroup: ''
  platform: ''
  useHelixMonitor: false

steps:
- template: /eng/pipelines/installer/helix.yml
  parameters:
    archType: ${{ parameters.archType }}
    condition: ${{ parameters.condition }}
    creator: ${{ parameters.creator }}
    osGroup: ${{ parameters.osGroup }}
    osSubgroup: ${{ parameters.osSubgroup }}
    useHelixMonitor: ${{ parameters.useHelixMonitor }}

    # IMPORTANT: Select public/internal queue aliases explicitly. Runtime macros expand too late
    # for helix.yml to strip the .Open suffix at template expansion time for internal runs.
    helixQueues:

    # Linux arm
    - ${{ if eq(parameters.platform, 'linux_arm') }}:
      - (Debian.13.Arm32.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:debian-13-helix-arm32v7@sha256:38844e127f1c1422bfbbfcb56012dfefc906d728f6a305bfd1aae70881ac6941

    # Linux arm64
    - ${{ if eq(parameters.platform, 'linux_arm64') }}:
      - (Ubuntu.2604.Arm64.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-26.04-helix-arm64v8@sha256:3c3d0dddb59c5da2f40df2e404de302f1b90c109b186ec21177857a7d68e6f42

    # Linux musl x64
    - ${{ if eq(parameters.platform, 'linux_musl_x64') }}:
      - (Alpine.324.Amd64.Open)AzureLinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64@sha256:be0195f3a02ff0136bf2c8337b3edcb3e0b534f6e2d6b7f2bd9bc0f1e7d8a262

    # Linux musl arm64
    - ${{ if and(eq(parameters.platform, 'linux_musl_arm64'), or(eq(parameters.isExtraPlatformsBuild, true), eq(parameters.includeAllPlatforms, true))) }}:
      - (Alpine.324.Arm64.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm64v8@sha256:b112398c98cc5c86e4fb3239be505b2d5b22e0a3e5e282339c3796ec4e386baa

    # Linux x64
    - ${{ if eq(parameters.platform, 'linux_x64') }}:
      - AzureLinux.3.Amd64.Open

    # OSX arm64
    - ${{ if eq(parameters.platform, 'osx_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_arm64)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_arm64_latest_internal)

    # OSX x64
    - ${{ if eq(parameters.platform, 'osx_x64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_x64)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_x64_latest_internal)

    # windows x64
    - ${{ if eq(parameters.platform, 'windows_x64') }}:
      - Windows.11.Amd64.Client.Open

    # windows x86
    - ${{ if eq(parameters.platform, 'windows_x86') }}:
      - Windows.11.Amd64.Client.Open

    # windows arm64
    - ${{ if eq(parameters.platform, 'windows_arm64') }}:
      - Windows.11.Arm64.Open

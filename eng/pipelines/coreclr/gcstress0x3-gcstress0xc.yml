trigger: none

schedules:
- cron: "0 13 * * 6,0"
  displayName: Sat and Sun at 5:00 AM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 780
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platformGroup: gcstress
        platforms:
        # It is too early to include osx_arm64 in platform group gcstress
        # Adding it here will enable it also
        - osx_arm64
        testGroup: gcstress0x3-gcstress0xc
        timeoutInMinutes: 720
        testRuns:
        - displayNameArgs: GcStress0x3Gcstress0xcTests

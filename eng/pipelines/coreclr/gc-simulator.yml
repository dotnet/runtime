trigger: none

# Scheduled runs are paused while we root-cause an ongoing issue.
# Do not remove this pipeline; re-enable by uncommenting the schedule below.
# schedules:
# - cron: "0 11 * * *"
#   displayName: Mon through Sun at 3:00 AM (UTC-8:00)
#   branches:
#     include:
#     - main
#   always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 900
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        buildConfig: release
        platforms:
        # disable Linux x64 for now until OOMs are resolved.
        # - linux_x64
        - linux_arm64
        - windows_x64
        - windows_arm64
        - osx_x64
        buildArgs: -s clr+libs -c $(_BuildConfig)
        testGroup: gc-simulator
        timeoutInMinutes: 840
        testRuns:
        - condition: not(and(eq(variables['osGroup'], 'osx'), eq(variables['archType'], 'x64')))
          displayNameArgs: GcSimulatorTests
          testBuildArgs: test GC/Scenarios/GC-simulator.csproj

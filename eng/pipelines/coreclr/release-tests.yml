trigger: none

schedules:
- cron: "0 6 * * *"
  displayName: Daily at 10:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - stage: Build
      jobs:
      - ${{ if eq(variables['enableHelixJobMonitor'], true) }}:
        - template: /eng/common/core-templates/job/helix-job-monitor.yml
          parameters:
            helixAccessToken: $(HelixApiAccessToken)
            timeoutInMinutes: 960
            allowNoHelixJobs: true

      #
      # Release CoreCLR and Library builds
      #
      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          helixQueueGroup: ci
          buildConfig: release
          platformGroup: all
          platforms:
          # It is too early to include osx_arm64 in platform group all
          # Adding it here will enable it also
          - osx_arm64
          jobParameters:
            buildArgs: -s clr+libs -c $(_BuildConfig)
            testGroup: outerloop
            liveLibrariesBuildConfig: Release
            timeoutInMinutes: 900
            postBuildSteps:
              # Release test runs
              - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                forwardedParameters:
                - testGroup
                parameters:
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
              # Release R2R test runs
              - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                forwardedParameters:
                - testGroup
                parameters:
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  testBuildArgs: generatelayoutonly crossgen2
                  readyToRun: true
                  displayNameArgs: R2R
                  runAfterPreviousFailure: true
                  timeoutPerTestInMinutes: 30
                  timeoutPerTestCollectionInMinutes: 90
                  # It is too early to include osx_arm64 in platform group all for R2R testing.
                  condition: >-
                    not(and(
                      eq(variables['osGroup'], 'osx'),
                      eq(variables['archType'], 'arm64')
                    ))
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                forwardedParameters:
                - testGroup
                - liveLibrariesBuildConfig

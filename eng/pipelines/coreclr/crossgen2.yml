trigger: none

schedules:
- cron: "0 6 * * *"
  displayName: Mon through Sun at 10:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - stage: Build
      jobs:
      - ${{ if eq(variables['enableHelixJobMonitor'], true) }}:
        - template: /eng/common/core-templates/job/helix-job-monitor.yml
          parameters:
            helixAccessToken: $(HelixApiAccessToken)
            timeoutInMinutes: 960
            allowNoHelixJobs: true

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          helixQueueGroup: pr
          buildConfig: checked
          platforms:
          - linux_x64
          - linux_arm64
          - osx_arm64
          - osx_x64
          - windows_x64
          - windows_arm64
          jobParameters:
            buildArgs: -s clr+libs -c $(_BuildConfig) -lc Release
            testGroup: innerloop
            liveLibrariesBuildConfig: Release
            timeoutInMinutes: 900
            postBuildSteps:
              - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                forwardedParameters:
                - testGroup
                parameters:
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  testBuildArgs: crossgen2
                  readyToRun: true
                  displayNameArgs: R2R_CG2
                  timeoutPerTestInMinutes: 30
                  timeoutPerTestCollectionInMinutes: 90
              # Run pri0 tests with hot/cold splitting enabled (only supported on x64 at the moment)
              # TODO: test on arm64 once supported
              - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                forwardedParameters:
                - testGroup
                parameters:
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  testBuildArgs: generatelayoutonly crossgen2
                  readyToRun: true
                  hotColdSplitting: true
                  displayNameArgs: R2R_CG2_HotColdSplitting
                  runAfterPreviousFailure: true
                  timeoutPerTestInMinutes: 30
                  timeoutPerTestCollectionInMinutes: 90
                  condition: eq(variables['archType'], 'x64')
            extraVariablesTemplates:
              - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                forwardedParameters:
                - testGroup
                - liveLibrariesBuildConfig

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
          buildConfig: Release
          platforms:
            - linux_x64
            - osx_x64
            - windows_x64
          jobParameters:
            testGroup: innerloop
            buildArgs: -s clr+libs+libs.tests
                       -c $(_BuildConfig)
                       /p:TestReadyToRun=true
                       /p:ArchiveTests=true
            nameSuffix: TestReadyToRun_Libraries
            timeoutInMinutes: 360
            postBuildSteps:
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  testRunNamePrefixSuffix: TestReadyToRun_$(_BuildConfig)
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}

trigger: none

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platforms:
        - linux_arm
        - linux_x64
        - linux_arm64
        - osx_arm64
        - osx_x64
        - windows_x86
        - windows_x64
        - windows_arm64
        helixQueueGroup: pr
        testGroup: innerloop
        testRuns:
        - testBuildArgs: composite
          readyToRun: true
          compositeBuildMode: true
          displayNameArgs: Composite
          timeoutPerTestInMinutes: 30
          timeoutPerTestCollectionInMinutes: 90
        # Composite mode with large version bubble (inputbubble)
        - testBuildArgs: generatelayoutonly composite
          readyToRun: true
          compositeBuildMode: true
          largeVersionBubble: true
          displayNameArgs: Composite_LargeVersionBubble
          runAfterPreviousFailure: true
          timeoutPerTestInMinutes: 30
          timeoutPerTestCollectionInMinutes: 90
          condition: >-
            and(
              eq(variables['archType'], 'x64'),
              in(variables['osGroup'], 'linux', 'windows')
            )

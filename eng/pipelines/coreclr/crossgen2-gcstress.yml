trigger: none

schedules:
- cron: "0 6 * * 0,1"
  displayName: Sat and Sun at 10:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 900
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platforms:
        - linux_x64
        - linux_arm64
        - osx_arm64
        # See https://github.com/dotnet/runtime/issues/71931
        # - osx_x64
        - windows_x64
        - windows_arm64
        helixQueueGroup: pr
        testGroup: gcstress-extra
        timeoutInMinutes: 840
        testRuns:
        - testBuildArgs: composite
          readyToRun: true
          compositeBuildMode: true
          displayNameArgs: Composite

# This pipeline is a subset of crossgen2-outerloop.yml and is retained for manual runs.
trigger: none
pr: none

# schedules:
# - cron: "0 5 * * *"
#   displayName: Mon through Sun at 9:00 PM (UTC-8:00)
#   branches:
#     include:
#     - main
#   always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 660
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platforms:
        - linux_arm
        - linux_arm64
        - linux_x64
        - osx_arm64
        - windows_arm64
        - windows_x64
        - windows_x86
        timeoutInMinutes: 600
        testRuns:
        - testBuildArgs: crossgen2
          readyToRun: true
          displayNameArgs: R2R
          timeoutPerTestInMinutes: 30
          timeoutPerTestCollectionInMinutes: 90

trigger: none

schedules:
- cron: "0 5 * * *"
  displayName: Mon through Sun at 9:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 1260
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platforms:
        - linux_arm
        - linux_arm64
        - linux_x64
        - osx_arm64
        - osx_x64
        - windows_x86
        - windows_x64
        - windows_arm64
        helixQueueGroup: pr
        timeoutInMinutes: 1200
        testRuns:
        # Test most platforms in composite mode as the expected mainline shipping mode.
        - testBuildArgs: composite
          readyToRun: true
          compositeBuildMode: true
          displayNameArgs: R2R_Composite
          timeoutPerTestInMinutes: 30
          timeoutPerTestCollectionInMinutes: 90
        # Composite mode with large version bubble (inputbubble)
        - testBuildArgs: generatelayoutonly composite
          readyToRun: true
          compositeBuildMode: true
          largeVersionBubble: true
          displayNameArgs: R2R_Composite_LargeVersionBubble
          runAfterPreviousFailure: true
          timeoutPerTestInMinutes: 30
          timeoutPerTestCollectionInMinutes: 90
          condition: >-
            and(
              eq(variables['archType'], 'x64'),
              in(variables['osGroup'], 'linux', 'windows')
            )
        # Outerloop testing in non-composite mode
        - testBuildArgs: generatelayoutonly crossgen2
          readyToRun: true
          displayNameArgs: R2R
          runAfterPreviousFailure: true
          timeoutPerTestInMinutes: 30
          timeoutPerTestCollectionInMinutes: 90

    # Build release CoreCLR for Crossgen2 baseline generation
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/common/global-build-job.yml
        buildConfig: release
        platforms:
        - linux_arm
        - linux_arm64
        - linux_x64
        - osx_arm64
        - osx_x64
        - windows_x86
        - windows_x64
        - windows_arm64
        jobParameters:
          buildArgs: -s clr+libs -c $(_BuildConfig) -lc Release
          postBuildSteps:
            - template: /eng/pipelines/common/upload-artifact-step.yml
              parameters:
                rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                includeRootFolder: false
                archiveType: $(archiveType)
                archiveExtension: $(archiveExtension)
                tarCompression: $(tarCompression)
                artifactName: Release_CoreCLR_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                displayName: Build Assets

    # Build Crossgen2 baselines
    # These are the various crossgen2 targets that are supported, and cover all major
    # significantly different code generators
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-build-job.yml
        buildConfig: Release
        platforms:
        - linux_arm
        - linux_arm64
        - linux_x64
        - osx_arm64
        - windows_x86
        - windows_x64
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release

    # test crossgen target Windows X86
    # This job verifies that 32-bit and 64 bit crossgen2 produces the same binaries,
    # and that cross-os targeting works
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-job.yml
        buildConfig: Release
        platforms:
        - linux_x64
        - windows_x86
        helixQueueGroup: pr
        helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release
          targetos: windows
          targetarch: x86

    # test target Linux X64
    # verify that cross OS targeting works
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-job.yml
        buildConfig: Release
        platforms:
        - windows_x64
        helixQueueGroup: pr
        helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release
          targetos: Linux
          targetarch: x64

    # test target Windows X64
    # verify that cross OS targeting works
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-job.yml
        buildConfig: Release
        platforms:
        - linux_x64
        helixQueueGroup: pr
        helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release
          targetos: windows
          targetarch: x64

    # test target Linux arm
    # verify that cross architecture targeting works
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-job.yml
        buildConfig: Release
        platforms:
        - linux_arm
        helixQueueGroup: pr
        helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release
          targetos: Linux
          targetarch: arm

    # test target Linux arm64
    # verify that cross architecture targeting works
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-job.yml
        buildConfig: Release
        platforms:
        - linux_arm64
        helixQueueGroup: pr
        helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release
          targetos: Linux
          targetarch: arm64

    # test target osx-arm64
    # verify that cross architecture targeting works
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/coreclr/templates/crossgen2-comparison-job.yml
        buildConfig: Release
        platforms:
        - osx_arm64
        helixQueueGroup: pr
        helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
        jobParameters:
          testGroup: outerloop
          liveLibrariesBuildConfig: Release
          targetos: OSX
          targetarch: arm64

trigger: none

schedules:
- cron: "0 18 * * 6,0"
  displayName: Sat and Sun at 10:00 AM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 660
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platforms:
        - linux_x64
        - windows_x64
        - windows_x86
        timeoutInMinutes: 600
        testRuns:
        - displayNameArgs: TieringTest
          tieringTest: true

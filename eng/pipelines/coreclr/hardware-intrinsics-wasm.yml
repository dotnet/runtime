trigger: none
pr:
  branches:
    include:
    - '*'
    exclude:
    - release/*
    - internal/release/*
  paths:
    include:
    - eng/pipelines/coreclr/hardware-intrinsics-wasm.yml
    - eng/pipelines/coreclr/templates/jit-hardware-intrinsics-wasm.yml
    - src/coreclr/crossgen-corelib.proj
    - src/coreclr/jit/*wasm*
    - src/tests/Directory.Build.targets
    - src/tests/build.proj
    - src/tests/JIT/HardwareIntrinsics/Wasm/**

variables:
  - template: /eng/pipelines/common/variables.yml
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    isOfficialBuild: false
    stages:
    - stage: Build
      jobs:
      - template: /eng/pipelines/coreclr/templates/jit-hardware-intrinsics-wasm.yml
        parameters:
          platforms:
            - browser_wasm
          extraBuildArgs: /p:PublishReadyToRunInstructionSet=relaxed-simd
          testBuildArgs: '/p:PublishReadyToRunInstructionSet=relaxed-simd -test:JIT/HardwareIntrinsics/HardwareIntrinsics_Wasm_r.csproj -test:JIT/HardwareIntrinsics/HardwareIntrinsics_Wasm_ro.csproj'
      - template: /eng/pipelines/coreclr/templates/jit-hardware-intrinsics-wasm.yml
        parameters:
          platforms:
            - wasi_wasm
          # Compiles CoreLib into each test composite, so the tests can use relaxed SIMD.
          extraHelixArguments: /p:WholeProgramCompositeBuildMode=true
          testBuildArgs: '/p:PublishReadyToRunInstructionSet=relaxed-simd -test:JIT/HardwareIntrinsics/HardwareIntrinsics_Wasm_r.csproj -test:JIT/HardwareIntrinsics/HardwareIntrinsics_Wasm_ro.csproj'

parameters:
  buildConfig: ''
  archType: ''
  osGroup: ''
  osSubgroup: ''
  container: ''
  liveLibrariesBuildConfig: ''
  crossBuild: ''
  variables: {}
  pool: ''
  runJobTemplate: '/eng/pipelines/coreclr/templates/run-superpmi-collect-job.yml'
  collectionType: ''
  collectionName: ''
  targetOS: ''
  targetArch: ''
  maxPartitionSizeMB: 25
  crossgen2Composite: ''

### SuperPMI job
### Each collection job depends on a corresponding build job with the same buildConfig and archType.

jobs:
- template: ${{ parameters.runJobTemplate }}
  parameters:
    # Compute job name from template parameters
    jobName: ${{ format('superpmi_collect_{0}{1}_{2}_{3}', parameters.osGroup, parameters.osSubgroup, parameters.archType, parameters.buildConfig) }}
    ${{ if eq(parameters.targetArch, '') }}:
      displayName: ${{ format('SuperPMI collect {4} {5} {0}{1} {2} {3}', parameters.osGroup, parameters.osSubgroup, parameters.archType, parameters.buildConfig, parameters.collectionName, parameters.collectionType) }}
    ${{ else }}:
      # Cross-target collections share the host osGroup/archType with a same-named host
      # collection, so include the target in the display name to tell them apart.
      displayName: ${{ format('SuperPMI collect {4} {5} {6} {7} {0}{1} {2} {3}', parameters.osGroup, parameters.osSubgroup, parameters.archType, parameters.buildConfig, parameters.collectionName, parameters.collectionType, parameters.targetOS, parameters.targetArch) }}
    pool: ${{ parameters.pool }}
    buildConfig: ${{ parameters.buildConfig }}
    archType: ${{ parameters.archType }}
    osGroup: ${{ parameters.osGroup }}
    osSubgroup: ${{ parameters.osSubgroup }}
    container: ${{ parameters.container }}
    crossBuild: ${{ parameters.crossBuild }}
    liveLibrariesBuildConfig: ${{ parameters.liveLibrariesBuildConfig }}
    collectionType: ${{ parameters.collectionType }}
    collectionName: ${{ parameters.collectionName }}
    targetOS: ${{ parameters.targetOS }}
    targetArch: ${{ parameters.targetArch }}
    maxPartitionSizeMB: ${{ parameters.maxPartitionSizeMB }}
    crossgen2Composite: ${{ parameters.crossgen2Composite }}
    # Test job depends on the corresponding build job
    dependsOn:
     - 'build_${{ parameters.osGroup }}${{ parameters.osSubgroup }}_${{ parameters.archType }}_${{ parameters.buildConfig }}_'
     - ${{ if eq(parameters.collectionName, 'coreclr_tests') }}:
        - 'coreclr_common_test_build_p1_AnyOS_AnyCPU_${{parameters.buildConfig }}'
     # Crossgen2 collections targeting browser/wasm compile the browser/wasm managed
     # assembly set, which comes from the browser-wasm CoreCLR runtime pack produced by
     # the browser_wasm_win Release build.
     - ${{ if eq(parameters.targetArch, 'wasm') }}:
        - 'build_browser_wasm_windows_Release_'

    variables:

    - name: crossArg
      value: ''
    - ${{ if eq(parameters.crossBuild, true) }}:
      - name: crossArg
        value: '-cross'

    - ${{ each variable in parameters.variables }}:
      - ${{insert}}: ${{ variable }}

    steps:
    # Extra steps that will be passed to the superpmi template and run before sending the job to helix (all of which is done in the template)

    # Download runtime artifacts
    - template: /eng/pipelines/common/download-artifact-step.yml
      parameters:
        unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
        artifactFileName: 'BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)$(archiveExtension)'
        artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
        displayName: 'Runtime build artifacts'

    # Download release runtime artifacts
    - template: /eng/pipelines/common/download-artifact-step.yml
      parameters:
        unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
        artifactFileName: 'BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_Release$(archiveExtension)'
        artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_Release
        displayName: 'Release runtime build artifacts'
        cleanUnpackFolder: false
        overwriteExistingFiles: true

    # For crossgen2 collections targeting browser/wasm, also download the browser-wasm
    # CoreCLR runtime pack. Its runtimes/browser-wasm/lib/<tfm>/*.dll and
    # runtimes/browser-wasm/native/System.Private.CoreLib.dll are what crossgen2 compiles.
    - ${{ if eq(parameters.targetArch, 'wasm') }}:
      - template: /eng/pipelines/common/download-artifact-step.yml
        parameters:
          unpackFolder: $(Build.SourcesDirectory)/artifacts/bin
          artifactFileName: 'WasmRuntimePack_browser_wasm_Release$(archiveExtension)'
          artifactName: WasmRuntimePack_browser_wasm_Release
          displayName: 'browser/wasm Release runtime pack'
          cleanUnpackFolder: false
          overwriteExistingFiles: true

    # Unzip individual test projects
    - ${{ if eq(parameters.collectionName, 'libraries_tests') }}:
      - template: /eng/pipelines/common/download-artifact-step.yml
        parameters:
          unpackFolder: '$(Build.SourcesDirectory)/artifacts/helix/'
          artifactFileName: 'LibrariesTestArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)$(archiveExtension)'
          artifactName: LibrariesTestArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
          displayName: 'Libraries test artifacts'
      - task: ExtractFiles@1
        displayName: 'Unzip libraries tests'
        inputs:
          archiveFilePatterns: '$(Build.SourcesDirectory)/artifacts/helix/**/*.zip'
          destinationFolder: '$(Build.SourcesDirectory)/artifacts/tests/libraries/$(osGroup).$(archType).$(buildConfigUpper)'
          cleanDestinationFolder: true
          overwriteExistingFiles: true

    # Download and unzip managed test artifacts
    - ${{ if eq(parameters.collectionName, 'coreclr_tests') }}:
      - template: /eng/pipelines/common/download-artifact-step.yml
        parameters:
          unpackFolder: '$(managedTestArtifactRootFolderPath)'
          artifactFileName: '$(managedGenericTestArtifactName).tar.gz'
          artifactName: '$(managedGenericTestArtifactName)'
          displayName: 'generic managed test artifacts'

    # Create Core_Root
    - script: $(Build.SourcesDirectory)/src/tests/build$(scriptExt) $(buildConfig) -arch $(archType) $(crossArg) generatelayoutonly $(librariesOverrideArg)
      displayName: Create Core_Root
      condition: succeeded()

    # Create Core_Root
    - script: $(Build.SourcesDirectory)/src/tests/build$(scriptExt) release -arch $(archType) $(crossArg) generatelayoutonly $(librariesOverrideArg)
      displayName: Create Release Core_Root
      condition: succeeded()


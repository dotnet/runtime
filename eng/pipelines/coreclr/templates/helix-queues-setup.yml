parameters:
  jobTemplate: ''
  variables: {}
  osGroup: ''
  osSubgroup: ''
  archType: ''
  container: ''
  pool: ''
  platform: ''
  shouldContinueOnError: false
  jobParameters: {}

# parameters.jobParameters.helixQueueGroup values:
# 'pr' -- pull request
# 'ci' -- continuous integration ("merge")
# 'libraries' -- libraries tests
# 'cet' -- machines supporting CET technology
# 'superpmi-diffs' -- as high capacity queues as possible since no OS testing is necessary for this
# Many of these values are unused below, as we use the same queues for many of the scenarios.
# However, having these options allows us to easily tune the queues we use for each scenario as needed based on new hardware support.

jobs:
- template: ${{ parameters.jobTemplate }}
  parameters:
    variables: ${{ parameters.variables }}
    osGroup: ${{ parameters.osGroup }}
    osSubgroup: ${{ parameters.osSubgroup }}
    archType: ${{ parameters.archType }}
    container: ${{ parameters.container }}
    pool: ${{ parameters.pool }}
    platform: ${{ parameters.platform }}
    shouldContinueOnError: ${{ parameters.shouldContinueOnError }}

    # IMPORTANT: Select public/internal queue aliases explicitly. Runtime macros expand too late
    # for helix.yml to strip the .Open suffix at template expansion time for internal runs.
    helixQueues:

    # iOS Simulator/Mac Catalyst arm64
    - ${{ if in(parameters.platform, 'iossimulator_arm64', 'tvossimulator_arm64', 'maccatalyst_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_ios_simulator_arm64)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_ios_simulator_arm64_internal)

    # iOS/tvOS Simulator x64 & MacCatalyst x64
    - ${{ if in(parameters.platform, 'iossimulator_x64', 'tvossimulator_x64', 'maccatalyst_x64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_ios_simulator_x64)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_ios_simulator_x64_internal)

    # Android arm
    - ${{ if in(parameters.platform, 'android_arm') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - Windows.11.Amd64.Android-armel.Open
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - Ubuntu.2204.Amd64.Android.29

    # Android arm64
    - ${{ if in(parameters.platform, 'android_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - Windows.11.Amd64.Android.Open
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - Windows.11.Amd64.Android

    # Android x64
    - ${{ if in(parameters.platform, 'android_x64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - Ubuntu.2204.Amd64.Android.29.Open
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - Ubuntu.2204.Amd64.Android.29

    # Browser and WASI wasm
    - ${{ if in(parameters.platform, 'browser_wasm', 'wasi_wasm') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - (Ubuntu.2604.Amd64.Open)AzureLinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-26.04-helix-webassembly-amd64@sha256:32f20cd4c2f598d642c011cadfd112aa8b0ab46433f5922f51fcb5613cd77191
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - (Ubuntu.2604.Amd64)AzureLinux.3.Amd64@mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-26.04-helix-webassembly-amd64@sha256:32f20cd4c2f598d642c011cadfd112aa8b0ab46433f5922f51fcb5613cd77191

    # iOS devices
    - ${{ if in(parameters.platform, 'ios_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_ios_device)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_ios_device_internal)

    # tvOS devices
    - ${{ if in(parameters.platform, 'tvos_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_tvos_device)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_tvos_device_internal)

    # Linux arm
    - ${{ if eq(parameters.platform, 'linux_arm') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - (Debian.13.Arm32.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:debian-13-helix-arm32v7@sha256:6f0cbb922c3a42b4c59690bd0a22b397af449b383b608e4ec512505031f3725f
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - (Debian.13.Arm32)AzureLinux.3.Arm64@mcr.microsoft.com/dotnet-buildtools/prereqs:debian-13-helix-arm32v7@sha256:6f0cbb922c3a42b4c59690bd0a22b397af449b383b608e4ec512505031f3725f

    # Linux arm64
    - ${{ if eq(parameters.platform, 'linux_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - AzureLinux.3.Arm64.Open
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - AzureLinux.3.Arm64

    # Linux musl x64
    - ${{ if eq(parameters.platform, 'linux_musl_x64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - (Alpine.324.Amd64.Open)AzureLinux.3.Amd64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64@sha256:51030dfb66b06d74370708164efca368c1b78da4f5b043b6daf0cd53e512cb02
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - (Alpine.324.Amd64)AzureLinux.3.Amd64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-amd64@sha256:51030dfb66b06d74370708164efca368c1b78da4f5b043b6daf0cd53e512cb02

    # Linux musl arm32
    - ${{ if eq(parameters.platform, 'linux_musl_arm') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - (Alpine.324.Arm32.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm32v7@sha256:e23edf1a625c3fb3da81e4879f8ea9c1d1cc94710e626fd6cd1ac7e814e2e64e
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - (Alpine.324.Arm32)AzureLinux.3.Arm64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm32v7@sha256:e23edf1a625c3fb3da81e4879f8ea9c1d1cc94710e626fd6cd1ac7e814e2e64e

    # Linux musl arm64
    - ${{ if eq(parameters.platform, 'linux_musl_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - (Alpine.324.Arm64.Open)AzureLinux.3.Arm64.Open@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm64v8@sha256:f0fc1962517f76d945d04054a14948469c0c2ec061e40bee97224d1892e9dbe8
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - (Alpine.324.Arm64)AzureLinux.3.Arm64@mcr.microsoft.com/dotnet-buildtools/prereqs:alpine-3.24-helix-arm64v8@sha256:f0fc1962517f76d945d04054a14948469c0c2ec061e40bee97224d1892e9dbe8

    # Linux x64
    - ${{ if eq(parameters.platform, 'linux_x64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - AzureLinux.3.Amd64.Open
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - AzureLinux.3.Amd64

    # OSX arm64
    - ${{ if eq(parameters.platform, 'osx_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_arm64)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_arm64_latest_internal)

    # OSX x64
    - ${{ if eq(parameters.platform, 'osx_x64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_macos_x64)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_macos_x64_latest_internal)

    # windows x64
    - ${{ if eq(parameters.platform, 'windows_x64') }}:
      - ${{ if and(eq(variables['System.TeamProject'], 'public'), ne(parameters.jobParameters.helixQueueGroup, 'cet')) }}:
        - $(helix_windows_x64_latest)
      - ${{ if and(eq(variables['System.TeamProject'], 'public'), eq(parameters.jobParameters.helixQueueGroup, 'cet')) }}:
        - $(helix_windows_x64_latest_cet)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_windows_x64_latest_internal)

    # windows x86
    - ${{ if eq(parameters.platform, 'windows_x86') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - Windows.10.Amd64.Open
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - Windows.10.Amd64.X86.Rt

    # windows arm64
    - ${{ if eq(parameters.platform, 'windows_arm64') }}:
      - ${{ if eq(variables['System.TeamProject'], 'public') }}:
        - $(helix_windows_arm64_latest)
      - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        - $(helix_windows_arm64_latest_internal)

    ${{ insert }}: ${{ parameters.jobParameters }}

parameters:
  archType: 'x64'
  osGroup: 'linux'
  buildConfig: ''
  runtimeFlavor: ''
  runtimeVariant: ''
  helixQueues: ''
  targetRid: ''
  nameSuffix: ''
  platform: ''
  shouldContinueOnError: false
  osSubgroup: ''
  enableWindowsRoslynCache: false

  # sccache version. Keep the version in sync across platforms so all jobs
  # cache against the same compiler-launcher behavior.
  sccacheVersion: '0.15.0'

steps:
  # Roslyn compiler cache
  - ${{ if and(or(eq(parameters.osGroup, 'linux'), eq(parameters.osGroup, 'freebsd'), eq(parameters.osGroup, 'openbsd'), eq(parameters.osGroup, 'osx'), and(eq(parameters.osGroup, 'windows'), eq(parameters.enableWindowsRoslynCache, true))), or(eq(parameters.archType, 'x64'), eq(parameters.archType, 'arm64'))) }}:
    # Cache entries restored by pull request builds come only from the pull
    # request itself or its target branch. This lets rolling builds seed the
    # cache without allowing pull requests to modify caches used by main.
    #
    # Keep Debug and Release entries separate so rolling builds can seed both
    # configurations without competing for the same immutable cache key.
    # Roslyn's own deterministic key accounts for legs that override the
    # matrix configuration in their build arguments.
    - task: Cache@2
      displayName: Roslyn compiler cache
      continueOnError: true
      inputs:
        key: roslyn | v2 | ${{ parameters.osGroup }}${{ parameters.osSubgroup }} | ${{ parameters.archType }} | ${{ parameters.nameSuffix }} | "$(buildConfigUpper)" | "$(Build.BuildId)"
        path: $(Pipeline.Workspace)/.roslyn-cache
        restoreKeys: |
          roslyn | v2 | ${{ parameters.osGroup }}${{ parameters.osSubgroup }} | ${{ parameters.archType }} | ${{ parameters.nameSuffix }} | "$(buildConfigUpper)"
          roslyn | v1 | ${{ parameters.osGroup }}${{ parameters.osSubgroup }} | ${{ parameters.archType }} | ${{ parameters.nameSuffix }}

    - ${{ if ne(parameters.osGroup, 'windows') }}:
      - script: |
          set -euo pipefail
          echo "##vso[task.setvariable variable=ROSLYN_CACHE_PATH]$(Pipeline.Workspace)/.roslyn-cache"
          echo "##vso[task.setvariable variable=ROSLYN_CACHE_BUILD_START]$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        displayName: Configure Roslyn compiler cache

    - ${{ if eq(parameters.osGroup, 'windows') }}:
      - pwsh: |
          $cachePath = Join-Path "$(Pipeline.Workspace)" ".roslyn-cache"
          $buildStart = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")

          Write-Host "##vso[task.setvariable variable=ROSLYN_CACHE_PATH]$cachePath"
          Write-Host "##vso[task.setvariable variable=ROSLYN_CACHE_BUILD_START]$buildStart"
        displayName: Configure Roslyn compiler cache

  # sccache native compiler cache
  - ${{ if and(or(eq(parameters.osGroup, 'linux'), eq(parameters.osGroup, 'freebsd'), eq(parameters.osGroup, 'openbsd'), eq(parameters.osGroup, 'osx')), or(eq(parameters.archType, 'x64'), eq(parameters.archType, 'arm64'))) }}:
    # Set up the Azure Pipeline Cache for sccache's local cache directory.
    # Use a rolling key so each build can update the cache; restoreKeys
    # falls back to the most recent saved entry.
    #
    # buildConfig is intentionally excluded from the key: it reflects
    # the *managed* Configuration (Debug for PRs, Release for rolling
    # builds), but sccache only caches native (C/C++) compilations whose
    # flags are controlled by RuntimeConfiguration (-rc), which is
    # constant per leg regardless of buildConfig. Omitting it lets PR
    # builds warm-start from rolling-build caches saved in the main scope.
    #
    # osGroup/osSubgroup/archType keep each platform's cache isolated so
    # Mac jobs don't poison the Linux entries (different compiler, different
    # cache contents).
    - task: Cache@2
      displayName: Sccache cache
      continueOnError: true
      inputs:
        key: sccache | ${{ parameters.osGroup }}${{ parameters.osSubgroup }} | ${{ parameters.archType }} | ${{ parameters.nameSuffix }} | "$(Build.BuildId)"
        path: $(Pipeline.Workspace)/.sccache
        restoreKeys: |
          sccache | ${{ parameters.osGroup }}${{ parameters.osSubgroup }} | ${{ parameters.archType }} | ${{ parameters.nameSuffix }}

    # Download sccache and configure the environment.
    #
    # The unsuffixed package contains the linux-musl-x64 binary. On macOS,
    # select the package matching the agent host architecture.
    - script: |
        set -euo pipefail
        sccacheVersion="${{ parameters.sccacheVersion }}"
        osGroup="${{ parameters.osGroup }}"
        sccachePackage="sccache"

        if [[ "$osGroup" == "osx" ]]; then
            case "$(uname -m)" in
                arm64)
                    sccachePackage="sccache.osx-arm64"
                    ;;
                x86_64)
                    sccachePackage="sccache.osx-x64"
                    ;;
                *)
                    echo "Unsupported macOS host architecture: $(uname -m)" >&2
                    exit 1
                    ;;
            esac
        fi

        "$(Build.SourcesDirectory)/eng/common/dotnet.sh" package download "${sccachePackage}@${sccacheVersion}" -o "$(Build.SourcesDirectory)/.packages" -v quiet
        sccacheDir="$(Build.SourcesDirectory)/.packages/${sccachePackage}/${sccacheVersion}/tools"

        chmod +x "$sccacheDir/sccache"
        echo "##vso[task.prependpath]$sccacheDir"
        echo "##vso[task.setvariable variable=SCCACHE_DIR]$(Pipeline.Workspace)/.sccache"
        echo "##vso[task.setvariable variable=SCCACHE_CACHE_SIZE]5120M"
        echo "##vso[task.setvariable variable=SCCACHE_IDLE_TIMEOUT]0"
        echo "##vso[task.setvariable variable=USE_SCCACHE]true"
      displayName: Download and configure sccache

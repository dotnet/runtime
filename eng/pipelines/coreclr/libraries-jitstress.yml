trigger: none

schedules:
- cron: "0 7 * * *"
  displayName: Daily at 11:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - stage: Build
      jobs:
      - ${{ if eq(variables['enableHelixJobMonitor'], true) }}:
        - template: /eng/common/core-templates/job/helix-job-monitor.yml
          parameters:
            helixAccessToken: $(HelixApiAccessToken)
            timeoutInMinutes: 540
            allowNoHelixJobs: true

      - template: /eng/pipelines/common/platform-matrix.yml
        parameters:
          jobTemplate: /eng/pipelines/common/global-build-job.yml
          buildConfig: Release
          helixQueueGroup: libraries
          helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
          platforms:
          - linux_x64
          - linux_arm
          - linux_arm64
          - windows_x86
          - windows_x64
          - windows_arm64
          jobParameters:
            # Default timeout is 150 minutes (2.5 hours), which is not enough for stress.
            timeoutInMinutes: 360
            buildArgs: -s clr+libs+libs.tests -rc Checked -c $(_BuildConfig) /p:ArchiveTests=true
            postBuildSteps:
              - template: /eng/pipelines/libraries/helix.yml
                parameters:
                  creator: dotnet-bot
                  extraHelixArguments: /maxcpucount:10
                  useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                  scenarios:
                    - no_tiered_compilation
                    - jitminopts
                    - jitstress1
                    - jitstress1_tiered
                    - jitstress2
                    - jitstress2_tiered
                    - disabler2r
                    - tailcallstress

trigger: none

pr:
  branches:
    include:
    - '*'
    exclude:
    - release/*
    - internal/release/*
  paths:
    include:
    - src/coreclr/jit/lsra*.*

schedules:
- cron: "0 7 * * *"
  displayName: Daily at 11:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/common/variables.yml

extends:
  template:  /eng/pipelines/coreclr/templates/jit-replay-pipeline.yml
  parameters:
    platforms:
    - windows_x64
    - windows_x86
    replayType: standard

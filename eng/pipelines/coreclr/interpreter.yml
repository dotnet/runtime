trigger: none

schedules:
- cron: "0 13 * * 1,3,5"
  displayName: Every Monday, Wednesday and Friday at 5:00 AM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/coreclr/templates/runtime-test-variables.yml

extends:
  template: /eng/pipelines/coreclr/templates/runtime-test-pipeline.yml
  parameters:
    monitorTimeoutInMinutes: 660
    jobs:
    - template: /eng/pipelines/coreclr/templates/runtime-test-jobs.yml
      parameters:
        platforms:
        - linux_x64
        - linux_arm64
        - windows_x64
        - windows_arm64
        - osx_x64
        - osx_arm64
        variables:
          - name: timeoutPerTestInMinutes
            value: 20
          - name: timeoutPerTestCollectionInMinutes
            value: 180
        timeoutInMinutes: 600
        testRuns:
        - displayNameArgs: InterpreterTests
          runInterpreter: true
